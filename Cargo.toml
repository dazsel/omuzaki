# The Omuzaki workspace (spec v3 §9, §39). Members are globbed so adding a crate never edits this file (§39 rule 11).
# Internal crates depend on each other with `path = "../<crate>"` in their own manifests, for the same reason.
[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/dazsel/omuzaki"

# External dependencies, versioned once (§39 rule 11). Every entry needs a row in docs/licensing/register.md.
[workspace.dependencies]
# Pre-declared early so parallel changes don't collide on this file. Unused entries cost nothing.
ab_glyph = "0.2"   # text rasteriser for character sheets (Apache-2.0; pure Rust, no shaping), omuzaki-stage
base64 = "0.23"   # standard base64 for MCP blob resources (MIT OR Apache-2.0), omuzaki-mcp; already in the lock through rmcp
crc32fast = "1.5"   # CRC-32 of journal frames (MIT OR Apache-2.0), omuzaki-doc; already in the lock
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
caseless = "0.2.2"   # Unicode full case folding, so two package paths that differ only in case collide (MIT), omuzaki-plugin
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }   # the seeded `wasi:random/insecure` stream of plugins (MIT OR Apache-2.0), omuzaki-plugin
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
constant_time_eq = "0.4"
directories = "6.0"   # the OS config and local data folders (MIT OR Apache-2.0; pulls dirs-sys and option-ext MPL-2.0, unmodified), omuzaki-settings
criterion = "0.8"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }   # verifies library item signatures (BSD-3-Clause), omuzaki-library-api; signing only in tests
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts"] }
egui = "0.36"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular", "fill"] }   # Phosphor icon fonts (MIT), omuzaki-ui icons
egui_tiles = { version = "0.17", features = ["serde"] }   # docking for the app shell (MIT OR Apache-2.0), omuzaki-ui
egui_kittest = { version = "0.36", features = ["wgpu"] }   # headless render + AccessKit queries for UI tests and gallery screenshots
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] } # gunzips the ONNX Runtime archives (MIT OR Apache-2.0), omuzaki-ai-native
fluent-bundle = "0.16" # Fluent message formatting (Apache-2.0 OR MIT), omuzaki-l10n-api catalog
fluent-langneg = "0.14" # locale negotiation (Apache-2.0), omuzaki-l10n-api
fluent-syntax = "0.12" # Fluent parser for the l10n checks (Apache-2.0 OR MIT), omuzaki-l10n-api
futures-util = { version = "0.3", default-features = false, features = ["std"] }   # drives the response body stream (MIT OR Apache-2.0), omuzaki-llm; already in the lock
getrandom = "0.4"
jiff = "0.2"   # wall-clock schedules and date conditions in IANA time zones, DST-aware, with a bundled tzdb on Windows (Unlicense OR MIT), omuzaki-live-nodes
keyring = "4.2"   # OS keychain: Windows Credential Manager, macOS Keychain, Linux Secret Service (MIT OR Apache-2.0), omuzaki-secrets
intl-memoizer ="0.5"   # named for the exact-integer FluentType in omuzaki-l10n-api (Apache-2.0 OR MIT; already a fluent-bundle dependency)
harfrust = "0.14"   # OpenType shaping (MIT): Arabic joining, Devanagari conjuncts, Thai marks in the sheet text fallback, omuzaki-stage
glam = { version = "0.34", features = ["serde", "bytemuck"] }
httpdate = "1"   # `Retry-After` HTTP dates (MIT OR Apache-2.0), omuzaki-http; already in the lock through hyper
hound = "3.5"   # WAV reading in the speech host benchmark (Apache-2.0), omuzaki-speech
symphonia = { version = "0.6", default-features = false, features = ["opt-simd", "pcm", "adpcm", "wav", "aiff", "flac", "ogg", "vorbis", "mp3", "aac", "isomp4"] }   # audio file decoding for sounds and music (MPL-2.0, unmodified; AAC needs the patent review before release, docs/licensing/deps/symphonia.toml), omuzaki-audio-decode; omuzaki-speech (the speech smoke clips)
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr"] }
inventory = "0.3"
cpal = { version = "0.18", default-features = false }   # audio device I/O for the live engine (Apache-2.0); `asio` stays off (docs/licensing/deps/cpal.toml), omuzaki-audio-engine
libc = "0.2"   # the Linux virtual camera's device calls (open, ioctl, write) (MIT OR Apache-2.0), omuzaki-vcam; already in the lock
memmap2 = "0.9"   # maps the live show's shared-memory objects (MIT OR Apache-2.0), omuzaki-shm (docs/design/supervisor.md §4.3); already in the lock
libm = "0.2"   # transcendental maths bit-identical on every platform (the CPU rasteriser's stroker, ADR 0009)
loom = "0.7"   # model checker for the metrics seqlock (MIT), omuzaki-metrics-api dev-dependency; only built with --cfg loom
# ONNX Runtime wrapper. `load-dynamic`: the app loads Microsoft's official MIT library from a path we choose, so Pyke's prebuilt binaries
# (and the TLS stack `download-binaries` drags in) never enter the build (register: ort). omuzaki-ai-ort.
nalgebra = { version = "0.35", default-features = false, features = ["std"] }   # matrix and rotation maths for the head-pose fit (Apache-2.0), omuzaki-track
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
pollster = "1"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }   # the live-show worker protocol's frame bodies (MIT OR Apache-2.0), omuzaki-stream-api (docs/design/supervisor.md §4.2)
proptest = "1.12"
regex = "1.13"   # JSON Schema `pattern` checks in the studio's forms (MIT OR Apache-2.0), omuzaki-ui; already in the lock through criterion
reqwest = { version = "0.13", default-features = false }
rhai = { version = "=1.26.1", default-features = false, features = ["std", "serde", "sync", "internals"] }   # the script runtime (MIT OR Apache-2.0); exact pin because `internals` is unstable API, omuzaki-script
rmcp = { version = "3.5", features = ["server", "transport-io", "transport-streamable-http-server"] }
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] } # opens beneath a folder handle, never through a link (openat2, O_NOFOLLOW), omuzaki-ops-api; safe renameat2(RENAME_EXCHANGE), omuzaki-doc (Linux)
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] } # TLS with `ring` as its one crypto provider (rustls MIT OR Apache-2.0 OR ISC; ring Apache-2.0 AND ISC), omuzaki-http; omuzaki-mcp tests (llm-api D11)
rustls-platform-verifier = "0.7"   # checks TLS certificates against the OS trust store (MIT OR Apache-2.0), omuzaki-twitch; already in the lock through reqwest
schemars = "1.2"
semver = { version = "1", features = ["serde"] } # versions in the updater contract (MIT OR Apache-2.0), omuzaki-update-api
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] } # recorded tracks must replay bit-identically after a save
sse-stream = "0.2"   # Server-Sent Events framing for the LLM providers (MIT OR Apache-2.0), omuzaki-llm; already in the lock through rmcp
sha2 = "0.10"   # pins the lazily downloaded fallback fonts by SHA-256 (MIT OR Apache-2.0), omuzaki-stage
ufbx = "0.11"   # FBX import (MIT OR Unlicense; compiles the bundled ufbx.c with cc), omuzaki-io-fbx
tar = { version = "0.4", default-features = false } # unpacks the ONNX Runtime.tgz archives (MIT OR Apache-2.0), omuzaki-ai-native
sys-locale = "0.3" # the OS language list (MIT OR Apache-2.0), omuzaki-l10n-api
tempfile = "3.27"
thiserror = "2"
tiny-skia = { version = "0.12", default-features = false, features = ["std"] }   # tests only: the oracle for the CPU face rasteriser's stroker (BSD-3-Clause)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
tokio-util = "0.7"
toml = "1.1"
toml_edit = "0.25"
unic-langid = "0.9"   # validated BCP 47 tags (MIT OR Apache-2.0), omuzaki-l10n-api
unicode-normalization = "0.1"   # NFC before font selection so a base and its marks pick one face (MIT OR Apache-2.0), omuzaki-stage
unicode-bidi = "0.3"   # visual order of mixed right-to-left and left-to-right sheet text (MIT OR Apache-2.0), omuzaki-stage
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The plugin host (ADR 0058): a component-model JIT with fuel and epochs and nothing else (no WASI, no cache, no async,
# no GC, no wat); `=49.0.0` because the host's WASI stubs and limits are written against this release (Apache-2.0 WITH
# LLVM-exception), omuzaki-plugin.
wasmtime = { version = "=49.0.0", default-features = false, features = ["cranelift", "component-model", "runtime", "std"] }
wasmparser = { version = "=0.258.3", default-features = false, features = ["std", "component-model"] }   # the canonical options of a plugin component, read before compiling (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT); the version wasmtime 49 uses, omuzaki-plugin
wat = "1"   # WAT text to wasm for the plugin host's test components (Apache-2.0 WITH LLVM-exception); dev-dependency only
wgpu = "30"
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }   # Media Foundation and COM (MIT OR Apache-2.0), omuzaki-camera-mf
windows-core = "0.62"   # the `implement` macro for the camera's COM callback (MIT OR Apache-2.0), omuzaki-camera-mf
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] } # the Windows side of the same: reparse-point-aware opens, final-path checks; the studio's reduce-motion read; Raw Input, HID, XInput and the kill switch's process list for omuzaki-input (ADR 0060)
# The OS input backends of omuzaki-input (ADR 0060, docs/design/input-motion.md §13 DEP-0); licences in docs/licensing/deps/
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }   # gamepads on Windows (XInput, not WGI) and Linux (Apache-2.0/MIT; links the system libudev dynamically)
x11rb = { version = "0.13", features = ["xinput"] }   # XInput2 raw events on Linux X11, pure-Rust connection; the version winit already locks (MIT OR Apache-2.0)
evdev = "0.13"   # the opt-in evdev capture on Linux (Apache-2.0 OR MIT)
objc2 = "0.6"   # macOS runtime bindings (MIT)
objc2-core-graphics = "0.3"   # the listen-only CGEventTap on macOS (Zlib OR Apache-2.0 OR MIT)
objc2-core-foundation = "0.3"   # the tap's run loop and Mach port on macOS (Zlib OR Apache-2.0 OR MIT)
objc2-game-controller = "0.3"   # GameController pads with background events on macOS (Zlib OR Apache-2.0 OR MIT)
objc2-io-kit = "0.3"   # the Input Monitoring check and the IOHID fallback on macOS (Zlib OR Apache-2.0 OR MIT)
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }   # NSString for the Syphon server's name on macOS (Zlib OR Apache-2.0 OR MIT), omuzaki-stream-share; already in the lock
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLTexture", "MTLResource", "MTLPixelFormat", "MTLTypes", "MTLCommandQueue", "MTLCommandBuffer"] }   # the Syphon output's Metal device and texture on macOS (Zlib OR Apache-2.0 OR MIT), omuzaki-stream-share; already in the lock
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }   # the GlobalShortcuts portal for bindings on Wayland (MIT)
midir = "0.11"   # MIDI controllers as binding sources (#469): ALSA, CoreMIDI and WinMM input (MIT)
url = "2"   # WHATWG URL parsing (MIT OR Apache-2.0), the xtask models gate; already in the lock
zeroize = "1.9"   # zeroes a secret value on drop (Apache-2.0 OR MIT; already in the lock), omuzaki-secrets-api
zip = { version = "9", default-features = false, features = ["deflate-flate2"] } # unpacks the ONNX Runtime Windows.zip archives (MIT), omuzaki-ai-native
vello = { version = "=0.11.0", default-features = false, features = ["wgpu"] }   # GPU vector face painter (Apache-2.0 OR MIT), omuzaki-face's GPU rasteriser (#1433)
vello_encoding = "=0.11.0"   # Vello's scene packing and buffer sizing, for omuzaki-face's own run of Vello's stages (Apache-2.0 OR MIT, #2074)
vello_shaders = { version = "=0.11.0", default-features = false, features = ["wgsl"] }   # Vello's compute shaders as WGSL, run by omuzaki-face with persistent resources (Apache-2.0 OR MIT, #2074)
whisper-rs = "0.16"   # whisper.cpp built from source (Unlicense crate, MIT library); omuzaki-speech
zune-jpeg = "0.5"   # pure-Rust JPEG decoder (MIT OR Apache-2.0 OR Zlib), MJPG webcam frames, omuzaki-pixfmt

[workspace.lints.rust]
unsafe_code = "deny"            # a crate that needs it (GPU/OS shims) allows it locally, with a why-comment
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # `omuzaki_ops_api::OpError` reads better than a bare `Error` in other crates
must_use_candidate = "allow"        # too noisy for small getters
unwrap_used = "deny"                # library code returns errors (see CONTRIBUTING.md); tests are exempt via clippy.toml
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"   # enough for backtraces; keeps the shared slot target dirs small

[profile.dev.package."*"]
opt-level = 2                # dependencies (glam, wgpu, image codecs) optimised: debug builds stay usable for real-time tests

[profile.dev.package.omuzaki-render-mock]
opt-level = 2                # the CPU rasteriser draws every mock render in the stage and UI tests, sample by sample

[profile.dev.package.omuzaki-char]
opt-level = 2                # the kit's geometry: its property and fit tests and every mock preview run about 4x faster

[profile.dev.package.omuzaki-face]
opt-level = 2                # the face painter: its sweep tests paint and rasterise thousands of frames (#2289)

[profile.release]
lto = "thin"
codegen-units = 16
