# Builds the dependency caches that ci.yml restores. This is the only workflow that SAVES caches.
#
# Why: the repository gets 10 GB of Actions cache, evicted least-recently-used. If every pull request saved its own
# entries they would push main's out, and a cache saved on a PR or merge-queue ref cannot be restored by any other
# run anyway (only the default branch's caches are shared). So main saves, everything else restores.
#
# Budget (measure on the first runs and adjust): test about 3 GB, lint about 2, win-cross about 2.5, xtask under 0.5.
# Each key is saved once per Cargo.lock/toolchain; a push that changes neither restores, finds nothing to add and
# finishes in a few minutes.
name: Cache warm

on:
  push:
    branches: [main]
  workflow_dispatch:

# Concurrency is per job: a newer push cancels an older run's Rust warm-up, but queues behind a LiteRT build, which can
# take hours and would otherwise never get to save.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Must match ci.yml: a different profile setting is a different build and would make the cache useless there.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  xtask:
    name: xtask
    runs-on: ubuntu-latest
    concurrency:
      group: cache-warm-xtask
      cancel-in-progress: true
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: xtask
          save-cache: true
      - run: cargo build --locked -p xtask

  lint:
    name: lint
    runs-on: ubuntu-latest
    concurrency:
      group: cache-warm-lint
      cancel-in-progress: true
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: lint
          save-cache: true
          free-disk: true
      - name: Build clippy and wasm artifacts
        run: |
          cargo build --locked -p xtask
          cargo clippy --locked --workspace --features omuzaki-cli/test-fixtures --all-targets
          mapfile -t wasm < <(python3 -I tools/ci/crates.py wasm)
          packages=(); for name in "${wasm[@]}"; do packages+=(-p "$name"); done
          cargo check --locked --target wasm32-unknown-unknown "${packages[@]}"

  test:
    name: test
    runs-on: ubuntu-latest
    concurrency:
      group: cache-warm-test
      cancel-in-progress: true
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: test
          save-cache: true
          gpu: true
          free-disk: true
      - name: Build every test binary (not run)
        run: cargo test --locked --workspace --features omuzaki-cli/test-fixtures --no-run

  win-cross:
    name: windows build
    runs-on: ubuntu-latest
    concurrency:
      group: cache-warm-win-cross
      cancel-in-progress: true
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-linux
        with:
          cache-key: win-cross
          save-cache: true
          windows-cross: true
          free-disk: true
      - run: cargo build --locked --workspace --target x86_64-pc-windows-gnu

  # Whether this push changed the LiteRT build's inputs: a push payload carries no file lists, so git compares the
  # push's two ends. A manual run, a new branch (`before` all zeros) or an unreachable `before` counts as changed, so a
  # doubt warms rather than skips.
  litert-changes:
    name: litert changes
    runs-on: ubuntu-latest
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 10
    concurrency:
      group: cache-warm-litert-changes
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          changed=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            paths=$(git diff --name-only "$BEFORE" "$AFTER" -- tools/litert/ .github/workflows/runtime-litert.yml)
            [ -n "$paths" ] || changed=false
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"
          echo "LiteRT inputs changed: $changed"

  # The LiteRT archive (runtime-litert.yml): built, checked and saved when its inputs change.
  litert:
    name: litert
    needs: litert-changes
    if: needs.litert-changes.outputs.changed == 'true'
    concurrency:
      group: cache-warm-litert
      cancel-in-progress: false
    uses: ./.github/workflows/runtime-litert.yml
    permissions:
      contents: read
    with:
      save-cache: true
