# Weekly macOS check on a GitHub-hosted runner. macOS minutes are billed at a higher rate, so it is a plain
# `cargo check` once a week with a hard time limit.
name: macOS weekly

on:
  schedule:
    - cron: "0 12 * * 0"   # Sundays, 12:00 UTC
  workflow_dispatch:

concurrency:
  group: macos-weekly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: cargo check
    runs-on: macos-latest
    if: github.repository == 'dazsel/omuzaki'
    timeout-minutes: 30
    # A job-level block replaces the workflow's, so contents: read is repeated for the checkout. issues: write is
    # for the failure report only.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Check the workspace
        run: cargo check --locked --workspace

      # Last step: runs only when a step above failed. Opens or comments on the "CI: weekly macOS failing" issue.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "CI: weekly macOS failing"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The weekly macOS check failed: $RUN_URL"
          fi
