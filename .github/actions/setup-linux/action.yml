name: Set up a Linux CI job
description: >-
  The Rust toolchain, system libraries, optional software Vulkan (lavapipe), prebuilt tools and the dependency cache.
  Run actions/checkout first. Shared by every Linux job so the setup lives in one place.

inputs:
  cache-key:
    description: Shared key of the dependency cache. Jobs of one kind share a key; an empty value turns the cache off.
    default: ""
  save-cache:
    description: "'true' to save the cache after the job. Only the cache-warm workflow does; every other run restores."
    default: "false"
  gpu:
    description: "'true' to install lavapipe (Mesa software Vulkan) and point wgpu at it."
    default: "false"
  windows-cross:
    description: "'true' to install the MinGW cross-compiler for the x86_64-pc-windows-gnu target."
    default: "false"
  free-disk:
    description: "'true' to delete preinstalled SDKs nobody here uses (about 30 GB), for jobs that build the whole workspace."
    default: "false"
  tools:
    description: Prebuilt cargo tools to install (taiki-e/install-action `tool` syntax, comma separated).
    default: ""

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.free-disk == 'true'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

    # rust-toolchain.toml pins the compiler, components and targets; rustup installs them here, before the cache key
    # is computed from the compiler version.
    - name: Rust toolchain
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: System packages
      shell: bash
      env:
        WINDOWS_CROSS: ${{ inputs.windows-cross }}
        GPU: ${{ inputs.gpu }}
      run: |
        packages=(pkg-config libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev)
        # libvulkan1 is the loader wgpu opens; mesa-vulkan-drivers ships lavapipe (lvp), the CPU Vulkan driver.
        if [[ $GPU == true ]]; then packages+=(libvulkan1 mesa-vulkan-drivers); fi
        if [[ $WINDOWS_CROSS == true ]]; then packages+=(gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64); fi
        # Every package here is Ubuntu's own. The image's Microsoft list isn't needed, and when its server refuses the
        # update (a 403, as on 2026-10-22) the whole job failed for nothing.
        sudo find /etc/apt/sources.list.d -name '*microsoft*' -delete
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          "${packages[@]}"

    # wgpu finds a Vulkan driver through the loader's ICD list. Name lavapipe's file explicitly (its file name differs
    # between Mesa packagings), set both variable spellings the loader has used, and fail here, with a clear message,
    # rather than in the middle of a render test.
    - name: Software Vulkan (lavapipe)
      if: inputs.gpu == 'true'
      shell: bash
      run: |
        icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | sort | head -n 1)
        if [[ -z $icd ]]; then echo "::error::lavapipe's ICD file is missing after installing mesa-vulkan-drivers"; exit 1; fi
        {
          echo "VK_ICD_FILENAMES=$icd"
          echo "VK_DRIVER_FILES=$icd"
          echo "WGPU_BACKEND=vulkan"
          # Four test processes share four vCPUs; keep each rasteriser to two threads so they don't oversubscribe.
          echo "LP_NUM_THREADS=2"
        } >>"$GITHUB_ENV"
        echo "lavapipe ICD: $icd"

    - name: Prebuilt tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: ${{ inputs.tools }}

    # Restore everywhere, save only where the caller says so (the cache-warm workflow on main). A PR or merge-queue ref
    # cannot share what it saves with other runs, and saving from every PR would evict main's entries from the 10 GB.
    - name: Dependency cache
      if: inputs.cache-key != ''
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache == 'true' }}

    - name: Disk and CPU
      shell: bash
      run: |
        df -h / | tail -n 1
        nproc
