# Canary: does a minidump written by `sentry-minidump` keep a camera-frame-like byte pattern out?
# Its own workspace root on purpose, like the spikes: it is a measuring tool that is never shipped, so it stays out of
# the main workspace's build and `cargo deny` sets. It sends nothing: no DSN that resolves, a transport that writes files.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "crash-canary"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
# Default features off drops the reqwest/TLS transport: the canary installs its own file-writing transport.
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images"] }
sentry-minidump = "0.49.3"

# The same lint table as the main workspace (Cargo.toml at the repo root).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
