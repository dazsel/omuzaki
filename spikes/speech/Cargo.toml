# Spike: a GPL-free speech stack for `omuzaki-audio` (Silero VAD and Whisper, without sherpa-onnx's espeak-ng).
# Its own workspace root on purpose: the spike stays out of the main workspace (members = crates/*, xtask), so
# whisper.cpp's CMake build and the ONNX Runtime wrapper never touch the shared build slots' dependency set.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "speech-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
hound = "3.5"
# `load-dynamic`: the app loads an ONNX Runtime library we choose at run time (Microsoft's official release, MIT), so
# the crate never downloads Pyke's prebuilt binaries (register: ort, "build ORT ourselves"). Default features off
# drops `download-binaries` and the TLS stack it drags in.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"] }
thiserror = "2"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3.27"

# The same lint table as the main workspace (Cargo.toml at the repo root).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
