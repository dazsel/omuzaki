[package]
name = "update-velopack-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"
description = "UP-0 spike: Velopack with a signed, identifier-free UpdateSource over an in-memory feed double. Never shipped."

# A standalone project: the empty table keeps cargo from treating it as a member of the repo workspace.
[workspace]

[dependencies]
# `public-utils` is required: `UpdateSource::get_release_feed` takes a `bundle::Manifest`, private without it.
velopack = { version = "=1.2.161", features = ["public-utils"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }
