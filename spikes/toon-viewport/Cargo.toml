# Spike: can a wgpu viewport inside eframe/egui match the JS prototype's toon shading?
# Its own workspace root on purpose: the spike stays out of the main workspace (members = crates/*, xtask), so its heavy
# GUI dependencies never touch the shared build slots' dependency set.
[workspace]
members = ["."]
resolver = "3"

[package]
name = "toon-viewport"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts"] }
glam = { version = "0.34", features = ["bytemuck"] }
gltf = { version = "1", default-features = false, features = ["import", "extras", "extensions", "utils", "names"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "30"

# The same lint table as the main workspace (Cargo.toml at the repo root).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 16
