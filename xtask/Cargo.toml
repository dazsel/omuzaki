[package]
name = "xtask"
description = "Repo automation: the checks agents and CI run (spec v3 §39 rules 9-10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `src/lib.rs` makes this a library as well as the `xtask` binary: the Apps' link-gate tests reuse its registration
# scan (ADR 0015).
[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# The library contract: `lint-seed` reads manifests and compares their canonical form exactly as the library hashes them.
omuzaki-library-api = { path = "../crates/omuzaki-library-api" }
# The model manifest contract the models gate reads (ML-01, ADR 0017).
omuzaki-ai-api = { path = "../crates/omuzaki-ai-api" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
