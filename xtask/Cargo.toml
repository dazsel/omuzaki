[package]
name = "xtask"
description = "Repo automation: the checks agents and CI run (spec v3 §39 rules 9-10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# `src/lib.rs` makes this a library as well as the `xtask` binary: the Apps' link-gate tests reuse its registration
# scan (ADR 0015).
[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true
# Not used directly: zip's `deflate-flate2` feature picks no backend, the workspace entry supplies the pure-Rust one.
flate2.workspace = true
# The library contract: `lint-seed` reads manifests and compares their canonical form exactly as the library hashes them.
omuzaki-library-api = { path = "../crates/omuzaki-library-api" }
# `lint-mods` asks the generator itself which children a folder declares, so the lint and the build share one rule.
omuzaki-embed = { path = "../crates/omuzaki-embed" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
