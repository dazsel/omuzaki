section = "models"
item = "VRoid Project CC0 sample models: β Ver AvatarSample_1 to 4 (alpha-era files AvatarSample_D to G, and AvatarSample_D_Darkness), Sendagaya Shino, Sakurada Fumiriya, Base_Female, Base_Male, HairSample_Female, HairSample_Male (VRM 0.x, as mirrored on OpenGameArt)"
kind = "asset"
used_for = "the starter characters (`crates/omuzaki-io-ops/data/starter-characters.toml`, fetched on demand by `io.starter.fetch`, never committed); measured proportions behind the `standard` and `tall` body templates (`crates/omuzaki-char/src/template/standard.rs`, `tall.rs`, `tests/templates.rs`) and the chin-tip limits in `tests/head_quality` (Base_Female and Base_Male)"
status = "yes"
condition = "CC0 at the primary source, read on 2026-10-29: pixiv's article https://vroid.pixiv.help/hc/en-us/articles/4402614652569 lists the base models, HairSample_Male, HairSample_Female and β Ver AvatarSample_1 to 4 as CC0 (\"Copyright is waived\"), and each model's own article states \"To the extent possible under law, pixiv Inc. has waived all copyright and related or neighboring rights to this model\" (β 1 to 4: articles 360012381793, 360014900273, 360014900113, 360014900233; Sendagaya Shino 360013482714; Sakurada Fumiriya 360014788554). The alpha-era file names map to the β names by the model titles in each file's VRM meta and their thumbnails (D = β 1, E = β 2, F = β 3, G = β 4), matching the portraits on their VRoid Hub pages, which also list corporate commercial use, modification and redistribution as allowed. Files come from https://opengameart.org/content/vroid-studio-cc0-models (re-exported from VRoid Studio 0.14.0 by its uploader, also released CC0), pinned by SHA-256 in the starter catalogue. No credit is owed; we credit the VRoid Project anyway and never imply pixiv endorses Omuzaki (\"VRoid\" is pixiv's trademark: use it only to say where a model came from). Not covered: VRoidPreset_A to Z and AvatarSample_A to C (see `vroid-presets-and-studio-output.toml`)"
audit = "(pixiv help centre and VRoid Hub, read 2026-10-29)"
