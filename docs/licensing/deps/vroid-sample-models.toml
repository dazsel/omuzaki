section = "models"
item = "VRoid Project sample models measured for the body templates: Base_Female, Base_Male, AvatarSample_E, AvatarSample_F, AvatarSample_G, Sendagaya Shino, Sakurada Fumiriya (the alpha-era VRoid Studio files, as mirrored on OpenGameArt)"
kind = "asset"
used_for = "measured proportions behind the `standard` and `tall` body templates (`crates/omuzaki-char/src/template/standard.rs`, `tall.rs`, `tests/templates.rs`) and the chin-tip limits in `tests/head_quality` (Base_Female and Base_Male only); face-layout measurement is not covered until a maintainer approves it"
status = "unverified"
condition = "only numbers were derived (joint heights, widths, head ratios, chin angles); no mesh, texture or image is shipped or committed, the files stay outside the repository. VRoid Studio sample avatars, credited to the VRoid Project (pixiv), not a third-party creator's characters, per the mirror page https://opengameart.org/content/vroid-studio-cc0-models (licence CC0, uploaded by \"hecko\"; reviewed on 2026-10-12). Not yet confirmed at the primary source: pixiv's article https://vroid.pixiv.help/hc/en-us/articles/4402614652569-Do-VRoid-Studio-s-sample-models-come-with-conditions-of-use says only some samples are CC0 (AvatarSample_A to C and VRoidPreset_A to Z are not), and it could not be read on 2026-10-13. To reach `yes`: confirm all seven are on its CC0 list and match the measured file names (`vroid-landmarks.md` on D:) to the alpha-era files, since the current VRoid Studio's AvatarSample_D to Z are different models"
audit = "(OpenGameArt page as reviewed; pixiv article unread)"
