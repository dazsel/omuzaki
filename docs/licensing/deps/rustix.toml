used_for = "verified file opens for ops (`CanonicalPath`, `omuzaki-ops-api`): `openat2`/`openat` with `O_NOFOLLOW` on Unix, reparse-point-aware `CreateFileW` and final-path checks on Windows. Chosen over cap-std, which follows links inside its sandbox and adds about ten crates; omuzaki-ui: probe process groups on Unix and the reduce-motion read on Windows (`SystemParametersInfoW`); omuzaki-input (ADR 0060): Raw Input on its own hidden window, HID and XInput on Windows (`Win32_UI_Input*`, `Win32_Devices_HumanInterfaceDevice`, `Win32_UI_WindowsAndMessaging`); the live-show worker protocol (`net`: `sendmsg` and `recvmsg` with `SCM_RIGHTS`, omuzaki-stream-api) and its shared memory (`fs`, `mm`: `memfd_create`, `shm_open`, omuzaki-shm), docs/design/supervisor.md §4"
