<rect x="248.2" y="100.0" width="129.6" height="200.0" fill="#2a6fdb"/>
<rect x="410.2" y="150.0" width="129.6" height="150.0" fill="#2a6fdb"/>
<rect x="572.2" y="200.0" width="129.6" height="100.0" fill="#2a6fdb"/>
<rect x="734.2" y="100.0" width="129.6" height="200.0" fill="#2a6fdb"/>
<line x1="232.0" x2="232.0" y1="50" y2="300" stroke="#444" stroke-dasharray="4 3"/>
<text x="236.0" y="62" text-anchor="start" font-size="11" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">Spine first in the cloud project</text>
<line x1="394.0" x2="394.0" y1="50" y2="300" stroke="#444" stroke-dasharray="4 3"/>
<text x="398.0" y="76" text-anchor="start" font-size="11" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">Switch to big one-shot spines</text>
<line x1="556.0" x2="556.0" y1="50" y2="300" stroke="#444" stroke-dasharray="4 3"/>
<text x="560.0" y="90" text-anchor="start" font-size="11" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">First-round area threads finish</text>
<line x1="718.0" x2="718.0" y1="50" y2="300" stroke="#444" stroke-dasharray="4 3"/>
<text x="722.0" y="104" text-anchor="start" font-size="11" fill="#222" stroke="#fff" stroke-width="3" paint-order="stroke">Work resumes in new chunks</text>
<rect x="70" y="338" width="12" height="12" fill="#2a6fdb"/><text x="88" y="348" fill="#333">peak open at once</text>
