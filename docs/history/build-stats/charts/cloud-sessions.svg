<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="sans-serif" font-size="12">
<rect width="900" height="360" fill="#fff"/>
<text x="70" y="24" font-size="16" font-weight="bold" fill="#222">Cloud project sessions open at once (peak per day)</text>
