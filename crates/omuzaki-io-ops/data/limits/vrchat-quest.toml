# VRChat Quest (Android; iOS shares the mobile table): the Avatar Performance Ranking limits, as data (VF-07). Numbers live only here.
#
# Source page dated Apr 21, 2026; read 2026-10-12 (two independent reads agreed on every value).
#
# Each row is [Excellent, Good, Medium, Poor]: an avatar's tier is the first column its value fits in, and anything
# above Poor is Very Poor. The page's wording: "If you go above these numbers for any category, you'll be bumped into
# the next rank." Counts are plain numbers, bounds are metres per axis (bounds_x, bounds_y, bounds_z), and texture_mib
# is in megabytes as the page prints them (compared in MiB, 1024 * 1024 bytes). The page's boolean rows (particle
# trails, particle collision) are written as 0 (False) and 1 (True).

platform = "vrchat-quest"
version = "Avatar Performance Ranking, page dated 2026-04-21"
source = "https://creators.vrchat.com/avatars/avatar-performance-ranking-system/"
retrieved = "2026-10-12"
tiers = ["Excellent", "Good", "Medium", "Poor"]
unsupported_note = "disabled on mobile: the platform strips the component and it is not counted toward the rank"

# How texture memory is estimated from pixel counts: bits per pixel for images without and with an alpha channel, and a
# full mip chain adding a third.
[texture]
opaque_bits = 3.56
alpha_bits = 3.56
mips = true

[stats]
triangles = [7500, 10000, 15000, 20000]
bounds_x = [2.5, 4, 5, 5]
bounds_y = [2.5, 4, 6, 6]
bounds_z = [2.5, 4, 5, 5]
texture_mib = [10, 18, 25, 40]
skinned_meshes = [1, 1, 2, 2]
basic_meshes = [1, 1, 2, 2]
material_slots = [1, 1, 2, 4]
physbones_components = [0, 4, 6, 8]
physbones_transforms = [0, 16, 32, 64]
physbones_colliders = [0, 4, 8, 16]
physbones_collision_checks = [0, 16, 32, 64]
contacts = [2, 4, 8, 16]
constraints = [30, 60, 120, 150]
constraint_depth = [5, 15, 35, 50]
animators = [1, 1, 1, 2]
bones = [75, 90, 150, 150]
lights = "unsupported"
particle_systems = [0, 0, 0, 2]
total_particles = [0, 0, 0, 200]
mesh_particle_polys = [0, 0, 0, 400]
particle_trails = [0, 0, 0, 1]
particle_collisions = [0, 0, 0, 1]
trail_renderers = [0, 0, 0, 1]
line_renderers = [0, 0, 0, 1]
raycasts = [1, 2, 4, 8]
cloths = "unsupported"
cloth_vertices = "unsupported"
physics_colliders = "unsupported"
physics_rigidbodies = "unsupported"
audio_sources = "unsupported"
