# VRChat's Avatar Performance Ranking limits, transcribed as data (VF-07). The numbers live only here.
#
# Source: https://creators.vrchat.com/avatars/avatar-performance-ranking-system/
# Page dated: Apr 21, 2026. Read: 2026-10-12 (two independent reads agreed on every value).
#
# Each row is [Excellent, Good, Medium, Poor]: an avatar rank is the first column its value fits in, and anything above
# Poor is Very Poor. The page's wording: "If you go above these numbers for any category, you'll be bumped into the
# next rank." Units: triangles and counts are plain numbers, bounds are metres per axis [x, y, z], and texture_mib is in
# megabytes as the page prints them (we compare in MiB, 1024 * 1024 bytes).
#
# A row that is absent on a platform is "Unsupported": the page says the component is disabled there, the platform
# strips it, and it is not counted toward the rank. The page lists these as disabled on mobile: lights, cloths, cloth
# vertices, physics colliders, physics rigidbodies and audio sources.
#
# Boolean rows on the page (particle trails, particle collision) are written as 0 (False) and 1 (True).

