# The starter characters: finished, rigged VRM characters whose licence lets Omuzaki hand them to anyone to perform as,
# edit and export (`io.starter.list`, `io.starter.fetch`). The files are not in the repository (ADR 0003): each is
# downloaded on first use from its pinned URL, checked against its SHA-256, and stored under the record below.
#
# Each licence was read at its primary source; the evidence is in `docs/licensing/deps/vroid-sample-models.toml` and
# `docs/licensing/deps/seed-san.toml`, and the survey behind the choice in
# `docs/research/2026-10-free-character-assets.md`. Add a starter only with a licence row that says `yes` or
# `conditions`, and only a licence that allows commercial use, modification and redistribution.
#
# Fields:
# - `id`: what `io.starter.fetch` takes; lowercase letters, digits and `-`.
# - `name`: the character's name, as its makers give it; `about`: one line on how it looks.
# - `licence`: SPDX or `LicenseRef-…`; `author`, `attribution` (the credit line, when the licence requires one) and
#   `source_url` (where the licence was read) go into the store's record with `commercial = "ok"`.
# - `terms`: what the licence grants, in the VRM `meta` vocabulary; the avatar's source row gets them, because a file's
#   own meta may say less than its licence (a VRoid Hub `Other` reads as "no modification, no redistribution").
# - `download`: the pinned file (`urls`, `sha256`, `size`). With `member`, the download is a zip archive and the model
#   is that member, pinned again by `member_sha256` and `member_size`.

[[starter]]
id = "vroid-shibu"
name = "Sendagaya Shibu"
about = "black bob with a hairpin, school uniform with an orange bow (VRoid β sample 1)"
licence = "CC0-1.0"
author = "VRoid Project (pixiv Inc.)"
source_url = "https://vroid.pixiv.help/hc/en-us/articles/360012381793"
terms = { avatarPermission = "everyone", allowExcessivelyViolentUsage = true, allowExcessivelySexualUsage = true, commercialUsage = "corporation", allowPoliticalOrReligiousUsage = true, allowAntisocialOrHateUsage = true, creditNotation = "unnecessary", allowRedistribution = true, modification = "allowModificationRedistribution" }
download = { urls = ["https://opengameart.org/sites/default/files/avatarsample_d_0.zip"], sha256 = "311a383b0b63b55102c82efa5ab2afec0dfcccc1cc6fa2db10fd5583981b3167", size = 13601220, member = "AvatarSample_D.vrm", member_sha256 = "9adf1b44e959d2688d62c2dd558e74315d6aa40e3bf8d281390b7a85dc0df9b7", member_size = 16851352 }

