[package]
name = "omuzaki-settings"
description = "The settings store: TOML files in the config and local data folders, merge-on-write, unknown keys kept, per-key migrations (spec v3 §31 SE-10; docs/design/settings.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
directories.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }

[dev-dependencies]
criterion.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-settings-mock = { path = "../omuzaki-settings-mock" }
proptest.workspace = true
tempfile.workspace = true

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true

# Native only: reads and writes files and takes OS file locks
[package.metadata.omuzaki]
kind = "Implementation"
summary = "settings store (SE-10): `settings.toml` and `machine.toml` edited in place (comments and unknown keys kept), locked merge-on-write by a debounced writer thread, per-key migrations, `Arc` snapshots and change events"
wasm = false
registers = true
