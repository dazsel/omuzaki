[package]
name = "omuzaki-http"
description = "The HTTPS client behind the Fetcher contract: HttpFetcher over reqwest with rustls, https only, bounded redirects and retries, streaming bodies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["blocking", "rustls", "system-proxy"] }
omuzaki-ai-api = { path = "../omuzaki-ai-api" }

[dev-dependencies]
bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "time"] }

[lints]
workspace = true

# Native only: the blocking reqwest client and its TLS stack have no wasm32 build
[package.metadata.omuzaki]
wasm = false
