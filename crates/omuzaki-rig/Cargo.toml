[package]
name = "omuzaki-rig"
description = "Rig: skeleton, humanoid pose solve, skinning matrices, spring bones and colliders (spec v3 §20; contracts omuzaki-anim-api, omuzaki-render-api)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
omuzaki-anim-mock = { path = "../omuzaki-anim-mock" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }

[[bench]]
name = "solve_skin"
harness = false

[[bench]]
name = "spring"
harness = false

[[bench]]
name = "ik"
harness = false

[[bench]]
name = "constraint"
harness = false

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the rig (§8, §20): `HumanoidRig` solves VRM normalised humanoid poses onto any skeleton, whatever its bone axes (and reads them back), `RigSkeleton` holds the tables derived from the rest pose, `Skinner` fills `Scene::joints` with skinning matrices; no allocation per frame"
