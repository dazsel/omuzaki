[package]
name = "omuzaki-cohost"
description = "The AI co-host on stage: the performer's turn loop over the perform host, its emotes through the character's expression triggers and its voice through the same lip sync and life cues as the person's microphone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-anim = { path = "../omuzaki-anim" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-llm = { path = "../omuzaki-llm" }
omuzaki-llm-api = { path = "../omuzaki-llm-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-performer = { path = "../omuzaki-performer" }
omuzaki-performer-api = { path = "../omuzaki-performer-api" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-speech = { path = "../omuzaki-speech" }
omuzaki-stage = { path = "../omuzaki-stage" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-track-voice = { path = "../omuzaki-track-voice" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The `cohost_live` example's: the model registry over local folders, the ONNX runtime, the mock engine, the kit
# character, and the software adapter for its pictures. Behind `demo`, so the tests never build them.
hound = { workspace = true, optional = true }
omuzaki-ai = { path = "../omuzaki-ai", optional = true }
omuzaki-ai-ort = { path = "../omuzaki-ai-ort", optional = true }
omuzaki-audio-mock = { path = "../omuzaki-audio-mock", optional = true }
omuzaki-char = { path = "../omuzaki-char", optional = true }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock", optional = true }
omuzaki-render = { path = "../omuzaki-render", optional = true }
omuzaki-render-api = { path = "../omuzaki-render-api", optional = true }
omuzaki-render-mock = { path = "../omuzaki-render-mock", optional = true }
sha2 = { workspace = true, optional = true }

[features]
# The end-to-end run on this machine's models (`examples/cohost_live.rs`).
demo = [
    "dep:hound",
    "omuzaki-ai",
    "omuzaki-ai-ort",
    "omuzaki-audio-mock",
    "omuzaki-char",
    "omuzaki-doc-mock",
    "omuzaki-render",
    "omuzaki-render-api",
    "omuzaki-render-mock",
    "dep:sha2",
]

[[example]]
name = "cohost_live"
required-features = ["demo"]

[dev-dependencies]
omuzaki-audio-mock = { path = "../omuzaki-audio-mock" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-llm-mock = { path = "../omuzaki-llm-mock" }
omuzaki-performer-mock = { path = "../omuzaki-performer-mock" }
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }
omuzaki-settings-mock = { path = "../omuzaki-settings-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
registers = true
# The perform host and the voice analysis are native.
wasm = false
summary = "the AI co-host on stage: the `performer.*` ops over `CohostService` (start, stop, say, intent, respond, status, transcript, the persona with the character), `LocalFactory` (the co-host from the app's speech models, microphone, mixer and the `performer.llm` setting, local by default), `MicMouth` (the microphone's lip sync while the co-host is quiet), `PerformStage` and `attach_voice` (its emotes and voice through the perform host), and `CohostThread`, which runs the turn loop, the stage and the voice together"
