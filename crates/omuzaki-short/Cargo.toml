[package]
name = "omuzaki-short"
description = "Shorts (spec v3 §26 SH-03, SH-05, SH-10): a short file (lines of a script with a face, a shot and a caption each) rendered headless and frame-exact to a finished video with its voice: the offline perform loop, the camera track, burned-in captions and the encoder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph.workspace = true
hound.workspace = true
omuzaki-anim = { path = "../omuzaki-anim" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
# Voice ids and the speed range of a spoken short.
omuzaki-performer-api = { path = "../omuzaki-performer-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-stage = { path = "../omuzaki-stage" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }
omuzaki-stream = { path = "../omuzaki-stream" }
omuzaki-track-voice = { path = "../omuzaki-track-voice" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[build-dependencies]
omuzaki-link-build = { path = "../omuzaki-link-build" }

[dev-dependencies]
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-render = { path = "../omuzaki-render" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
registers = true
# The encoder loads libvpx and libopus at run time.
wasm = false
summary = "shorts: the `short.*` ops (`short.render`, `short.plan`, `short.draft`) over a short file: lines of a script with a face, a shot and a caption each, rendered headless through the stage at any size, with the offline perform loop (life, grammar, lip sync), the camera track (cuts, punch-ins, dutch roll, handheld), burned-in captions and VP9 + Opus WebM out"
