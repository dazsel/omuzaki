# The words `character.create_from_description` knows (`src/lexicon.rs` says how it is read).
#
# - `[[facet]]`: one thing a description can say, in the order the steps run. `many` facets take several options;
#   `prior` lists the options drawn by the seed when the description says nothing (empty: the kit's default stays).
# - `[[option]]`: what one choice does. `words` are the phrases that choose it (lower case; a plural `s` matches too).
#   `template` and `style` go to `character.create`; `fits` lists the templates the option needs; `replaces` removes
#   parts the kit's default character has; `parts` adds parts (or changes the one with that id); `steps` run ops, with
#   `$character` for the character's id; `hints` are weaker phrases (`mage` for a robe) that choose only when
#   nothing stronger chooses for the same facet or part; `colour` says where a colour named with the option goes (`a red dress`);
#   `near` makes the option's words count only next to a thing of that kind (`long` only as in `long silver hair`).
# - `[[colour]]`: a named colour, with a hand-picked hair gradient (root, middle, tip) where the derived one doesn't
#   read as that colour of hair. `[[target]]`: the nouns a colour goes to on its own. `[priors]`: the colours an
#   unnamed hair, eye or outfit colour is drawn from.
#
# Every phrase means one thing (a test checks), and every option's steps plan on a fresh character (a test checks).

# ---------------------------------------------------------------- facets, in step order

[[facet]]
id = "build"
summary = "The body template: chibi, petite, average or tall"

[[facet]]
id = "age"
summary = "How old the character reads: the mature style (narrow eyes, small mouth, a longer face)"

[[facet]]
id = "body_shape"
summary = "The body's shape: slim, athletic, curvy, broad..."

[[facet]]
id = "skin"
summary = "The skin tone, very fair to deep"

[[facet]]
id = "outfit"
summary = "The whole outfit: school uniform, hoodie, dress, kimono, robe, suit, maid, bodysuit..."
prior = ["uniform", "uniform", "hoodie", "dress", "blazer", "cloak"]

[[facet]]
id = "bottoms"
summary = "A skirt or trousers"

[[facet]]
id = "legwear"
summary = "Tights, stockings, leggings or bare legs"

[[facet]]
id = "footwear"
summary = "Boots, sneakers, loafers, heels, sandals or flats"

[[facet]]
id = "hair_length"
summary = "How long the hair is"
prior = ["short", "medium", "long", "long"]

[[facet]]
id = "hair_style"
summary = "How the hair is worn: loose, twin tails, a ponytail, braids, buns"
prior = ["loose", "loose", "loose", "twintails", "ponytail", "side-braids"]

[[facet]]
id = "hair_texture"
summary = "The hair's texture: straight (the kit's own), wavy or curly"

[[facet]]
id = "bangs"
summary = "The fringe: blunt, side-swept, curtain, wispy or none"

[[facet]]
id = "hair_extra"
summary = "Extras in the hair: an ahoge"
many = true

[[facet]]
id = "ears"
summary = "Elf ears or animal ears"

[[facet]]
id = "eyes"
summary = "The eye design: sparkly, droopy, sharp, sleepy, cat, doll or realistic"

[[facet]]
id = "makeup"
summary = "Makeup: natural, soft glam, idol or gothic"
refines = ["skin"]

[[facet]]
id = "expression"
summary = "The face at rest: cheerful, calm, smug, shy, serious..."

[[facet]]
id = "accessories"
summary = "Glasses, hats, horns, wings, a tail, headphones, a halo, jewellery and more"
many = true

# ---------------------------------------------------------------- build and age

[[option]]
facet = "build"
id = "chibi"
summary = "Chibi: a big head on a small body (the soft-sd template)"
words = ["chibi", "sd", "super deformed", "tiny", "cute little"]
template = "soft-sd"

[[option]]
facet = "build"
id = "petite"
summary = "Petite: short and slight (the mini template)"
words = ["petite", "short girl", "short boy"]
hints = ["kid", "child", "small"]
template = "mini"

[[option]]
facet = "build"
id = "average"
summary = "Average anime proportions (the standard template)"
words = ["average height", "medium height"]
hints = ["teen", "teenage", "teenager", "student"]
template = "standard"

[[option]]
facet = "build"
id = "tall"
summary = "Tall, with long legs (the tall template)"
words = ["tall", "long legged", "leggy", "statuesque"]
template = "tall"

[[option]]
facet = "age"
id = "mature"
summary = "Mature: narrow almond eyes under heavy lashes, a small mouth and a longer face"
words = ["mature", "adult", "grown up", "older"]
hints = ["elegant", "woman", "lady", "gentleman", "queen", "onee san"]
style = "mature"
fits = ["standard", "tall"]

