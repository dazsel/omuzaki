[package]
name = "omuzaki-brief"
description = "Characters from words (#2578): `character.create_from_description` turns a written description into kit parameters through the kit's own ops, checks the result against the description, and reports every choice it made; `character.brief_vocabulary` lists the words it knows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The kit's ops (`character.create`, `part.*`, `hair.*`, `body.*`, `palette.*`) and their part kinds, which the brief
# runs by name and reads the defaults of.
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
# The face ops (`face.eyes.preset`, `face.makeup.preset`, `face.set_style`, `face.expression.set_default`).
omuzaki-face = { path = "../omuzaki-face" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[build-dependencies]
omuzaki-link-build = { path = "../omuzaki-link-build" }

[dev-dependencies]
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
registers = true
summary = "characters from words: `character.create_from_description` (a description to kit parameters through the kit's own ops, a self-check and every choice reported) and `character.brief_vocabulary`"
