# The 20 descriptions #2578 is judged on: written the way people describe a character they want, from a one-liner to
# a paragraph, across builds, outfits, hair, faces and accessories. `expect` lists choices the reading must make
# (`facet = "option"`, or a list for a facet that takes several; a colour target names its colour id); the test
# checks each, builds every one on three seeds, and the self-check must hold. The renders of all 20 are the evidence
# raters judge (the ≥ 70% "that's her" bar is a hand check).

[[case]]
description = "a sleepy librarian with silver twin tails and round glasses"
expect = { eyes = "sleepy", outfit = "blazer", hair_style = "twintails", accessories = ["round-glasses"], hair_colour = "silver" }

[[case]]
description = "a cheerful idol with pink hair fading to blonde, sparkly eyes and a red dress"
expect = { expression = "happy", makeup = "idol", eyes = "sparkle", outfit = "dress", outfit_colour = "red", hair_colour = "pink to blonde" }

[[case]]
description = "tall elegant witch with long black hair, a purple robe and a witch hat"
expect = { build = "tall", age = "mature", outfit = "robe", outfit_colour = "purple", hair_length = "long", hair_colour = "black", accessories = ["witch-hat"] }

[[case]]
description = "a chibi fox girl with orange hair, a fluffy tail and a hoodie"
expect = { build = "chibi", ears = "animal", hair_colour = "orange", accessories = ["fox-tail"], outfit = "hoodie" }

[[case]]
description = "a shy elf mage with long green hair in a braid and a white cloak"
expect = { expression = "shy", ears = "elf", outfit = "cloak", outfit_colour = "white", hair_length = "long", hair_colour = "green", hair_style = "braid" }

[[case]]
description = "a cyberpunk hacker with short teal hair, cat ear headphones and a black bodysuit"
