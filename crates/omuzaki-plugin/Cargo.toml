[package]
name = "omuzaki-plugin"
description = "The WASM plugin host (PL-01, ADR 0058): wasmtime components under fuel, epoch deadlines and memory caps, the WASI stub subset, the worker threads, faults, restarts and the plugin log; packages, signatures and the compiled-code cache."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
semver.workspace = true
chacha20.workspace = true
getrandom.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmtime.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-plugin-api = { path = "../omuzaki-plugin-api" }

