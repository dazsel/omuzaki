omuzaki-plugin-mock = { path = "../omuzaki-plugin-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the WASM plugin host (PL-01, ADR 0058): wasmtime 49 components with fuel and epoch deadlines per `CallKind`, the CPU share, the per-import fuel charge and host-call bucket, `StoreLimits`-style caps and the all-plugins memory reservation, the WASI stub subset, a worker thread per plugin, faults, restart backoff and auto-disable (`WasmPlugins`), the capped and rotated plugin log, and packages (folder or `.zip`), their content hash and signatures, installs and the compiled-code cache; native only"
# A JIT host has no place in a browser: wasmtime compiles machine code at run time (ADR 0058, design §1).
wasm = false
