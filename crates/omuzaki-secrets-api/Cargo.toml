[package]
name = "omuzaki-secrets-api"
description = "Contract for the secret store (CN-05): SecretLabel, SecretValue, the SecretStore trait and SecretError; a value never reaches a log, an event, an op record or MCP output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true   # the compile-fail doctests on `SecretValue` name `Serialize`

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the secret-store contract (CN-05): `SecretLabel` (a slug path such as `automation/streamerbot`), `SecretValue` (zeroed on drop; no `Debug`, `Display`, `Serialize` or `Clone`; only `expose`), `SecretStore` (`get`, `contains`, `labels`, `set`, `delete`), `SecretError`; no keychain code; the real store is `omuzaki-secrets`, the fake `omuzaki-secrets-mock`"
