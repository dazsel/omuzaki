[package]
name = "omuzaki-youtube"
description = "The YouTube adapter (spec v3 BR-10): a live stream's chat, Super Chats, Super Stickers, memberships and gifted memberships, and new subscribers, polled through the YouTube Data API and normalised into the show's events; the youtube.* ops. The token comes from the secret store and never leaves the request header."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-http-api = { path = "../omuzaki-http-api" }
omuzaki-live-api = { path = "../omuzaki-live-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-http-mock = { path = "../omuzaki-http-mock" }
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the YouTube adapter (BR-10): finds the channel's live broadcast (or a named video's chat), polls `liveChatMessages.list` at the interval YouTube asks for, normalises chat, Super Chats and Super Stickers (`tip`), new and milestone memberships (`sub`), gifted memberships (`sub_gift`) and new subscribers (`follow`), skips the backlog the first page returns, counts the quota it spends, stops cleanly on a refused token, a spent quota or the stream ending; `YouTubeService` and the ops `youtube.connect`, `youtube.disconnect`, `youtube.status`; native only"
# Native only: it calls YouTube.
wasm = false
# The youtube.* ops register themselves (ADR 0015, `cargo xtask lint-registers`).
registers = true
