# The built-in expression library (spec FE-03): what a new character's face starts with (`ExpressionSet::library`).
#
# Each table is one expression: its kind, its intensity curve, and the channels it moves at full weight, in the bus's own
# vocabulary (ARKit-52 plus the anime extras), so a tracker, a score, lip sync and an expression all speak one language.
# Expressions add: a mood under a viseme, an accent over a mood. Moods are tuned with `face.expression.range_test` on
# the default face: every mood and accent reads apart from every other at 56 px, and from the resting face.
#
# The five visemes and `blink` are the VRM contract. The visemes keep the starter's mouth openings (lip sync is tuned to
# them); `ih` and `ee` differ from the starter in width and teeth, because the range test found the starter's two read
# the same: `ih` is the wide flat "i" with the upper teeth, `ee` the narrower "e" with both rows. Accents are small
# additive extras (hearts, sweat) meant to sit on top of a mood.
#
# Playback (how a trigger shows it): every mood is in the exclusive group `mood`, so showing one hides the last, and
# stays until it is hidden. Accents are momentary: they play over the mood, which steps back while they show, and stop
# on their own. Moods hold at least 1.1 s before another replaces it (`dwell_s`), so faces don't flicker, and their
# fades follow their family: alert faces (surprise, fear, anger) come in in 0.12 s, leave in 0.3 s and cut in through
# another's hold; warm faces (happy, shy, smug) take 0.3 s and 0.42 s; down faces (sad, worried, sleepy) take 0.45 s
# and 0.6 s; the rest keep the default 0.12 s and 0.2 s.
#
# Curves: `smooth` for most moods (soft in, soft out), `ease_out` for the ones that should show early (surprise, a
# laugh, fear), `ease_in` for the ones that should creep in (sleepy, smug).

# ---------------------------------------------------------------------------------------------------------- visemes

[aa]
kind = "viseme"
deltas = { jawOpen = 0.74, mouthSmileLeft = 0.1, mouthSmileRight = 0.1 }

[ih]
kind = "viseme"
deltas = { jawOpen = 0.24, mouthStretchLeft = 0.9, mouthStretchRight = 0.9, mouthUpperUpLeft = 0.8, mouthUpperUpRight = 0.8, mouthSmileLeft = 0.35, mouthSmileRight = 0.35 }

[ou]
kind = "viseme"
deltas = { jawOpen = 0.36, mouthFunnel = 0.85 }

[ee]
kind = "viseme"
deltas = { jawOpen = 0.28, mouthStretchLeft = 0.15, mouthStretchRight = 0.15, mouthUpperUpLeft = 0.5, mouthUpperUpRight = 0.5, mouthLowerDownLeft = 0.6, mouthLowerDownRight = 0.6 }

[oh]
kind = "viseme"
deltas = { jawOpen = 0.54, mouthFunnel = 0.65 }

[blink]
kind = "blink"
deltas = { eyeBlinkLeft = 1.0, eyeBlinkRight = 1.0 }

