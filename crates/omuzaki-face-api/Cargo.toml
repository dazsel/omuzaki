[package]
name = "omuzaki-face-api"
description = "Contract for the procedural face: how channels become paint parameters, face profiles, expressions and the painter that turns them into vector draw lists (spec v3 §19, CB-20..25)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The built-in expression library is a TOML file compiled in (`ExpressionSet::library`).
toml.workspace = true
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-io-api = { path = "../omuzaki-io-api" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the procedural face (§19, CB-20..25): `FaceMapping` (the ARKit-native bus to `PaintParams`, coefficients in the profile), `FaceProfile` and its eye, brow, mouth, nose and cheek designers, expressions and visemes, and the `FacePainter` contract with its vector `DrawList` and layer compositing"
