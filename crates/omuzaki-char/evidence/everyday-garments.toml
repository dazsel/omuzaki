# Render cases for `tools/ci/evidence.py` from the everyday garments: the shirt and its collar and tie, the skirt over
# tights, the vest, the trousers and the boots. The format is documented at the top of tools/ci/evidence.py.
#
# Each picture is one garment on one template, through the mock toon renderer, framed on the garment: front and
# three-quarter on the top row, side and back below.

[[case]]
name = "shirt"
description = "The shirt (#190) on the body, on every template."
env = { OMUZAKI_SHIRT_PPM = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "outfit_shirt", "render_the_shirt_when_asked", "--", "--exact"] },
]
images = ["soft-sd.ppm", "mini.ppm", "standard.ppm", "tall.ppm"]

[[case]]
name = "neckwear"
description = "The collar and the striped tie (#191) on the shirt, on every template."
env = { OMUZAKI_NECKWEAR_PPM = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "outfit_neckwear", "render_the_neckwear_when_asked", "--", "--exact"] },
]
