# The fit-to-reference heatmap (#2158), rendered by `tools/ci/evidence.py` for pull requests labelled `visual`. The
# format is documented at the top of that script.

[[case]]
name = "fit-heatmap"
description = "The difference heatmap of the fitted body against a synthetic reference, front and side, as fit.reference returns it (red: the fitted body is outside the reference; blue: the reference is outside it). The legend strip prints the IoU."
env = { OMUZAKI_FIT_HEATMAP_DIR = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "fit_ops", "write_the_heatmaps_when_asked", "--", "--exact"] },
]
images = ["heatmap-front.png", "heatmap-side.png"]
