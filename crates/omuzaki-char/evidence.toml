# Render cases for `tools/ci/evidence.py`: CI renders each at the PR's base and at the PR, for pull requests labelled
# `visual` (.github/workflows/visual-evidence.yml). The format is documented at the top of tools/ci/evidence.py.
#
# Ears and brows: the human and elf ears are still stubs (src/head/ears) and the brows are painted by omuzaki-face, so
# no case isolates them yet. `head-part` is the picture where they show once built; add `ears` and `brows` closeups
# here with the change that makes them render.

[[case]]
name = "head-part"
description = "The built head through the mock toon renderer: front, three-quarter and side, 512 px, fixed camera."
env = { OMUZAKI_HEAD_PART_PPM = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "head_part", "render_the_head_part_when_asked", "--", "--exact"] },
]
images = ["front.ppm", "three-quarter.ppm", "side.ppm"]

[[case]]
name = "body-kinds"
description = "The ten body presets on the soft-sd template, front above side (tools/body-kind-sheet.py)."
env = { OMUZAKI_SHEET_DIR = "{out}/obj" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "body", "--", "--ignored", "--exact", "dump"] },
    { run = ["python3", "-I", "tools/body-kind-sheet.py", "{out}/obj", "{out}", "soft-sd", "hip"] },
]
images = ["soft-sd-front-side.png", "soft-sd-hip.png"]

[[case]]
name = "body-shape"
description = "Every body-shape axis at -1, 0 and +1 as silhouettes over the template (tools/body-shape-sheet.py)."
env = { OMUZAKI_SHEET_DIR = "{out}/pics" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "body_shape", "--", "--ignored", "--exact", "sheet"] },
    { run = ["python3", "-I", "tools/body-shape-sheet.py", "{out}/pics", "{out}"] },
]
images = ["contact-sheet.png"]

[[case]]
name = "stature-lineup"
description = "The templates side by side at their real-world heights (tools/stature_lineup.py)."
steps = [
    { run = ["cargo", "run", "--locked", "-q", "-p", "omuzaki-char", "--example", "stature_lineup"], stdout = "lineup.json" },
    { run = ["python3", "-I", "tools/stature_lineup.py", "{out}/lineup.json", "{out}/lineup.png"] },
]
images = ["lineup.png"]

[[case]]
name = "head-join"
description = "The eye-line join of the five head presets, front, three-quarter and side, 384 px, fixed camera per view. The head surface only: the ears are left out."
env = { OMUZAKI_HEAD_JOIN_PPM = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "head_join_sheet", "render_the_head_join_when_asked", "--", "--exact"] },
]
images = [
    "round-u-front.ppm", "round-u-three-quarter.ppm", "round-u-side.ppm",
    "egg-oval-front.ppm", "egg-oval-three-quarter.ppm", "egg-oval-side.ppm",
    "mochi-front.ppm", "mochi-three-quarter.ppm", "mochi-side.ppm",
    "heart-front.ppm", "heart-three-quarter.ppm", "heart-side.ppm",
    "long-front.ppm", "long-three-quarter.ppm", "long-side.ppm",
]

[[case]]
name = "garment-framework"
description = "A shirt and a vest stacked on the body, and every trim on a tube garment, front and three-quarter on standard and soft-sd through the mock toon renderer, 512 px; each patterned fabric's tile at a 2x2 repeat."
env = { OMUZAKI_GARMENT_PPM = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-char", "--test", "outfit_framework", "render_the_garment_framework_when_asked", "--", "--exact"] },
]
images = [
    "standard-pair-front.ppm", "standard-pair-three-quarter.ppm", "standard-trims-front.ppm", "standard-trims-three-quarter.ppm",
    "soft-sd-pair-front.ppm", "soft-sd-pair-three-quarter.ppm", "soft-sd-trims-front.ppm", "soft-sd-trims-three-quarter.ppm",
    "tile-weave.ppm", "tile-vertical-stripes.ppm", "tile-horizontal-stripes.ppm", "tile-diagonal-stripes.ppm", "tile-plaid.ppm",
]
