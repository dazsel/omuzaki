# Skin tone 4 of 12 (CB-04): light medium. The base is the neutral-undertone colour in OKLCH (lightness 0..1,
# chroma, hue in degrees); `skin_ramp` derives every other colour from it (`src/palette/skin_tone.rs`).
id = "tone-04"
name = "Light medium"

[base]
l = 0.756
c = 0.072
h = 49.0

# `Shading::Toon.skin` for this tone: the shadow floor as a fraction of the albedo, and how strongly coloured light is
# pulled back to the skin hue. Lower values keep the warm shade tint alive; higher ones fight a strong colour cast. The
# floor rises on deeper tones because the filmic tone curve crushes dark values hardest.
[skin]
floor = 0.36
hue_keep = 0.66
