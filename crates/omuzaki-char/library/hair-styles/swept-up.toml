id = "swept-up"
name = "Swept up"
summary = "Short sides and back with the top swept up off the forehead and back over the crown in a loose quiff."
origin = "a written description of the cut (short back and sides, the top brushed up and back with lift at the front), built from the kit's generators and guide clumps and tuned by eye on the kit's renders"

[volume]
whorl = { polar_deg = 30.0, azimuth_deg = 180.0 }
fullness = 1.05
crown = 1.25
back = 0.95

[groups.a-cap]
dynamics = { simulate = false, follow = "head" }

[groups.a-cap.generator]
type = "cap"
hairline_front_deg = 60.0

[groups.c-nape]
dynamics = { simulate = false, follow = "head" }

