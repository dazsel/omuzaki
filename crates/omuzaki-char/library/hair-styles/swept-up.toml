count = 30
columns = 2
wave = { amplitude = 0.0, frequency = 1.0, curl = 0.0 }
width = { start = 0.06, mid = 0.07, tip = 0.02, tip_at = 0.75 }

[groups.b-quiff]
dynamics = { simulate = false, follow = "head" }
lock = { tip = "fork", spread = 0.4 }

