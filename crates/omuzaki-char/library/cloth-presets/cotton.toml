# Cotton: the solver's medium cotton, a little stiff in bending as toon skirts are (a 3 cm bending length).
density = 0.2
stretch = 1.0e-4
shear = 1.0e-3
bend = 2.0e4
damping = 2.0
thickness = 0.002
max_stretch = 0.05
friction = [0.6, 0.4]
# The soft hold toward the designed shape (a soft pin's weight on every free particle).
shape = 1e-5
