# The body's anatomy (#2614): subcutaneous fat, the muscles that shape the silhouette and the bony points that show
# through, as z-scores with their spreads (`sd_mm`) and loadings on the shared factors (see anatomy-face.toml). Body
# effects are a fraction `t` along a region from its start (the hips for the torso, the shoulder for an arm, the hip
# for a leg) and lobes round its section, as the body dials are; `amount` is a weight, 1 the full spread.
#
# Origin: design targets from skinfold and limb-girth surveys and the usual course of ageing (fat gathering at the
# waist from middle age, muscle thinning after sixty); rounded, no body is measured.

# ----------------------------------------------------------------------------------------------------------- fat

[[structure]]
id = "neck_fat"
name = "Neck fat"
summary = "The fat round the neck: +1 a thick, soft neck, -1 lean"
tissue = "fat"
group = "neck"
sd_mm = 5.0
factors = { adiposity = 0.9 }
age = [[45.0, 0.0], [70.0, 0.4]]
[[structure.effects]]
frame = "body"
region = "neck"
t = 0.45
span = 0.7
lobes = { all = 0.5, front = 1.0 }
amount = 1.0

