# Body dials (#2612): regional swellings of the body's regions, placed by a fraction along the region and shaped round
# its section, so one definition serves every template and body shape. Amounts are fractions of the section's radius.
# Sided dials are written for the left side (+x); the right is mirrored. Design targets from surface anatomy (the
# deltoid, biceps, the calf's gastrocnemius, the gluteal mass), not likenesses. Age reaches the body through its
# anatomy (anatomy-body.toml: the belly filling in middle age, muscle thinning late, a child's flat chest), so these
# dials carry no age curves of their own.

[[dial]]
id = "neck_girth"
name = "Neck girth"
summary = "+1 a thick neck; -1 a slender one"
group = "neck"
prior = 0.3
[[dial.effects]]
frame = "body"
region = "neck"
t = 0.5
span = 0.75
lobes = { all = 1.0 }
amount = 0.12

