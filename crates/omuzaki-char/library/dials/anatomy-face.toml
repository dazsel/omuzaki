# The face's anatomy (#2614): the bone, fat pads, muscles and skin under the head's surface. Each structure is a
# z-score: `sd_mm` is one standard deviation of its thickness across adults, `factors` how strongly the shared factors
# move it, `age` its course in standard deviations, `descent` how far its centre has moved down the face. The fat pads
# overlap, so each one's spread is its share of the cheek's: together they vary as the soft tissue there does (a few
# millimetres a standard deviation). Effects are
# placed as the face dials are (a landmark of the face layout, nudged in the head's own proportions; `reach` degrees
# round the head), and `amount` is a weight: 1 is the full spread at the centre. Sided structures are written for the
# character's left (+x).
#
# Origin: design targets from published craniofacial soft-tissue depth studies (the thickness and spread at the
# glabella, the zygion, the gonion, mid-philtrum and the chin), the anatomy of the facial fat compartments, and the
# well-known course of facial ageing (fat pads deflating and descending, the orbit widening, the maxilla and the
# mandible's angle resorbing, the nose's cartilage lengthening, the skin thinning into folds). No face is measured or
# traced; the numbers are rounded design targets.

