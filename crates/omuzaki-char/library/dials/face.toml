# Face dials (#2612): regional shape controls on the head, each a bump round a landmark of the face read from the face
# layout, so it finds the cheek or the jaw on any profile and template. Amounts are fractions of the distance from the
# head's centre; `reach` is degrees round the head. Sided dials are written for the character's left (+x).
#
# Origin: design targets from facial anatomy (the fat pads, the zygomatic arch, the mandible's angle, the brow ridge)
# and the ranges sliders in character creators expose; no likeness is traced. Age reaches the face through its anatomy
# (anatomy-face.toml: the fat pads deflating and descending, the bone resorbing, the folds deepening), so these dials
# carry no age curves of their own.

[[dial]]
id = "cheek_fullness"
name = "Cheek fullness"
summary = "+1 full, round cheeks (the malar fat pad); -1 lean cheeks"
group = "face"
sided = true
prior = 0.3
[[dial.effects]]
frame = "head"
landmark = "cheek_left"
reach = 28.0
push = "radial"
amount = 0.06

