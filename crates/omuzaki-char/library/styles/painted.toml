# Painted: a soft 2D painted illustration, on the standard and tall templates.
#
# Natural anime proportions drawn softly: medium round eyes with a glowing iris, a wet catchlight and a caustic, fine
# curled lashes, a gentle lid shadow; a dot of a nose and a soft mouth both modelled by light and shade rather than a
# line; a painted blush. Long wavy hair. Soft shading leaning toward cel with gentle volume.
id = "painted"
name = "Painted"
family = "anime"
summary = "Soft 2D painted illustration: glowing round eyes, a nose and mouth modelled by light rather than lines, a painted blush and soft volume."
origin = "Design target: the conventions of painted character illustration (soft edges, features modelled by light and colour instead of line, glowing irises and wet catchlights), tuned by eye on the kit's own renders; no traced likeness."
templates = ["standard", "tall"]
profile = "egg-oval"
hair = "wavy-long"
look = "soft-sd"
shading = 0.8

