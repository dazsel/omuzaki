# Comic: the inked Western comic book, on the tall and standard templates.
#
# Smaller, narrower eyes with a small iris and a pin of light, a heavy inked crease and lower lid, no strand lashes;
# thick, shaped brows; a long drawn nose with a strong shadow; a wide mouth; cheekbones hatched in. A heroic build:
# broad shoulders, muscle, long legs. Hard cel shading with heavy lines.
id = "comic"
name = "Comic"
family = "western"
summary = "Inked comic book: narrow eyes under a heavy crease, thick brows, a long shadowed nose, a wide mouth and a heroic build, in hard cel."
origin = "Design target: the Western comic-book drawing conventions (smaller eyes with a heavy crease and lower lid, anatomical noses and mouths drawn with shadow shapes, heroic proportions near eight heads), tuned by eye on the kit's own renders; no traced likeness."
templates = ["tall", "standard"]
profile = "egg-oval"
hair = "messy-short"
look = "cel-flat"
shading = 1.0

[face.layout]
eye_width = 0.042
eye_spacing = 0.084
brow_gap = 0.055

[face.eyes]
scale = 0.86
lid_shadow = 0.7

[face.eyes.aperture]
roundness = 0.32
upper_height = 0.55
lower_depth = 0.45
tilt = 0.05
inner_sharpness = 0.9
outer_bluntness = 0.3

[face.eyes.iris]
width = 0.45
height = 0.56
drop = 0.04

[face.eyes.highlights]
