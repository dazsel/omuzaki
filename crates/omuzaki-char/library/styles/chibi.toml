# Chibi: super-deformed, on the soft-sd and mini templates (2.5 and 3 heads tall).
#
# A round mochi face with enormous round eyes set low and wide, a big iris full of catchlights, short soft lashes, no
# nose, a tiny mouth and short brows. A short neck and mitten hands; twin tails.
id = "chibi"
name = "Chibi"
family = "anime"
summary = "Super-deformed: a round face with enormous low-set eyes full of catchlights, no nose, a tiny mouth and a body two to three heads tall."
origin = "Design target: the super-deformed model-sheet conventions (2 to 3 heads tall, eyes on or below the head's middle line, a third of the face wide each, no nose, a tiny mouth), tuned by eye on the kit's own renders; no traced likeness."
templates = ["soft-sd", "mini"]
profile = "mochi"
hair = "twin-tails"
look = "soft-sd"
shading = 1.0

[face.layout]
eye_width = 0.06
eye_spacing = 0.094
brow_gap = 0.078

[face.eyes]
scale = 1.3
lid_shadow = 0.35

[face.eyes.aperture]
roundness = 0.92
upper_height = 0.92
lower_depth = 0.82
tilt = 0.0
inner_sharpness = 0.5
outer_bluntness = 0.8

[face.eyes.iris]
width = 0.8
height = 1.1
drop = 0.0

[face.eyes.highlights]
shape = "blob"
size = 0.38
shimmer = 0.4
second = 0.7
extra = [
    { shape = "blob", offset = [-0.35, -0.4], size = 0.12, opacity = 0.85 },
]

[face.eyes.lash]
thickness = 0.006
flick = 0.35
lower = 0.2

[face.eyes.lash.strands]
upper = { count = 10, length = 0.2 }
lower = { count = 0 }

[face.eyes.crease]
strength = 0.0

[face.mouth]
half_width = 0.006

[face.nose]
kind = "none"

[face.brows]
thickness = 0.0016
arch = 0.004

[body]
hands = "mitten"

[body.proportions]
neck_length = 0.8
