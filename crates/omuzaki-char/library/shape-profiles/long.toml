# Face-shape preset `long` (CB-10). Head-local metres. The numbers are fitted to the targets in
# tests/shape_presets.rs and already sit inside the plausible space of head/outline.rs, so the outline named here
# is the outline that is built.
id = "long"
summary = "A long face with a stretched chin."

[outline]
half_width = 0.1451
top = -0.0823
height = 0.1457
exponent = 1.650
exponent_lower = 1.560
cheek_puff = 0.0000

[outline.chin]
y = -0.2280
stretch_top = -0.0823
min_ratio = 0.60

# A taller, narrower head than the default cranium's (#1690).
[cranium]
width = 0.9
height = 1.1

[layout]
eye_y = -0.0820
eye_spacing = 0.0820
eye_width = 0.0426
brow_gap = 0.0800
nose_y = -0.1287
mouth_y = -0.1754
blush_y = -0.1346
blush_spacing = 0.0984
