# Face-shape preset `round-u` (CB-10). Head-local metres. The numbers are fitted to the targets in
# tests/shape_presets.rs and already sit inside the plausible space of head/outline.rs, so the outline named here
# is the outline that is built.
id = "round-u"
summary = "A soft round U: a short lower face, wide at the cheeks, with no chin point."

