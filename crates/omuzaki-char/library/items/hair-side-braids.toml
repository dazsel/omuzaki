schema = 1
id = "omuzaki/hair/side-braids"
version = "1.0.0"
section = "hair"
kind = "setting"
target = "character"
title = "Side braids"
summary = "A braided lock falling in front of each shoulder."
tags = ["hair", "braid", "braids", "locks"]
origin = "the kit's tail generator presets (#2411), tuned by eye on the kit's renders"
compat = { kinds = ["humanoid"], templates = ["*"], requires = ["hair"] }
target_part = ["hair"]

[rights]
author = "Omuzaki"
licence = "CC0-1.0"
commercial = "ok"
owned = true

[[step]]
op = "part.set_param"
[step.args]
character = "$character"
part = "$target"
path = "groups"
value = { side-braids = { mirror = true, dynamics = { simulate = false }, generator = { type = "tail", root = [100.0, 82.0, 0.012], length = 0.42, lean = -0.05, forward = 0.45, braid = { crossings = 6.0, width = 0.044, face_deg = 90.0 } } } }
