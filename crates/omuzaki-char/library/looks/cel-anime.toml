# Cel anime: the hard-edged three-tone cel of anime-styled games made in real-time engines. Lit, shade and a deep shade
# with crisp edges, a small hard highlight, a bright lit-edge rim, and bold coloured lines.
id = "cel-anime"
name = "Cel anime"
summary = "Hard three-tone cel (lit, shade, deep shade), a small hard highlight, a bright lit-edge rim and bold lines."
origin = """Design target: anime-game cel shading (three hard tones, a cel highlight, a lit rim, inverted-hull lines), \
recreated with Omuzaki's own `stylized` program. Numbers are this preset's own, chosen by rendering the kit character."""

[params.all]
softness_scale = 0.15
outline_width_scale = 1.4
outline_colour = "material"

[params.skin.program]
name = "stylized"

[params.skin.program.params]
shade-2-strength = { float = 0.6 }
shade-2-shift = { float = -0.55 }
shade-2-softness = { float = 0.0 }
rim-width = { float = 0.1 }
rim-strength = { float = 0.8 }

[params.cloth.program]
name = "stylized"

[params.cloth.program.params]
shade-2-strength = { float = 1.0 }
shade-2-shift = { float = -0.4 }
shade-2-softness = { float = 0.0 }
spec-strength = { float = 0.15 }
spec-size = { float = 0.06 }
spec-softness = { float = 0.0 }
rim-width = { float = 0.08 }
rim-strength = { float = 0.5 }

[params.scene]
bloom = true
