# Cinematic: the physical end of the style axis, shot like film, for the high-fidelity character style.
#
# Every class physical (subsurface skin, fibre-lit hair, a conductor for metal, sheen on cloth) with no lines, ambient
# occlusion and contact shadows at full strength, depth of field on what the camera looks at, bloom, a fine film grain
# and a filmic touch of contrast.
id = "cinematic"
name = "Cinematic"
summary = "Physical and filmic: subsurface skin, hair partly lit as fibres, no lines, full occlusion, depth of field, bloom and a fine film grain."
origin = """Design target: real-time cinematic character rendering (physical materials, no ink, occlusion and contact \
shadows, a shallow focus, film grain); numbers tuned by eye on the kit's renders."""

[params.all]
style = 0.0
outline_width_scale = 0.0

# The kit's anime fringe casts a hard, jagged hair shadow that reads as a stain on physical skin; the occlusion seats
# the fringe instead. Hair stays a little toward cel, where the kit's hair cards read best.
[params.skin]
receives_hair_shadow = false

[params.hair]
style = 0.35

[params.scene]
bloom = true
depth_of_field = true
grain = 0.015

[params.scene.grade]
contrast = 1.08
saturation = 0.96

[params.scene.occlusion]
strength = 0.9
