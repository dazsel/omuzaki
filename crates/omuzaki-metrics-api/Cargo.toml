[package]
name = "omuzaki-metrics-api"
description = "Contract for the live-metrics snapshot: four sections published through a lock-free seqlock and read as one `LiveMetrics` (research 2026-10-live-metrics-snapshot, §2 to §4)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
schemars.workspace = true
serde.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true

# Only built for the model checker: `RUSTFLAGS="--cfg loom" cargo test -p omuzaki-metrics-api --release loom`.
[target.'cfg(loom)'.dev-dependencies]
loom.workspace = true

[[bench]]
name = "metrics_publish"
harness = false

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the live-metrics snapshot (§2 to §4 of the research note): `metrics()` makes one writer per section (frame, perform, tracker, audio) and a cloneable `MetricsReader`; a seqlock over safe atomics, no lock and no allocation on publish; `read()` gives one `LiveMetrics` with the derived `BudgetUse` rows"
