[package]
name = "omuzaki-track"
description = "The webcam face tracker (PF-01): MediaPipe's detector, face mesh and blendshape graphs over ai-api sessions, with video-mode tracking, landmark smoothing and head pose, reporting anim-api track frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nalgebra.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
# Unpacks MediaPipe's official `face_landmarker.task` for the `tflite` runtime (src/task.rs).
omuzaki-ai-native = { path = "../omuzaki-ai-native" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-pixfmt = { path = "../omuzaki-pixfmt" }
omuzaki-track-api = { path = "../omuzaki-track-api" }

[dev-dependencies]
criterion.workspace = true
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-track-mock = { path = "../omuzaki-track-mock" }
sha2.workspace = true
tempfile.workspace = true
# Writes stand-in `.task` bundles (src/task.rs).
zip.workspace = true

[[bench]]
name = "doctor"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "webcam"
harness = false

# Native only: the webcam capture path (camera thread, pixel conversion) has no wasm32 counterpart.
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the webcam face tracker (PF-01), ported from the `spikes/webcam-track` spike: MediaPipe's BlazeFace detector, Face Mesh V2 and Blendshape V2 graphs as `omuzaki-ai-api` sessions (`FaceGraphs`, three slot signatures), video-mode ROI tracking, One-Euro landmark smoothing and the Procrustes head-pose fit; `FaceTracker::track` allocates nothing after warm-up and returns a fixed-size `FaceSample`, which `to_track_frame` turns into an `anim-api` `TrackFrame`. Tested over `omuzaki-ai-mock` scripted sessions. The `webcam` module adds `WebcamTracker` (the `omuzaki-track-api` `Tracker`): a camera thread that converts each frame (`omuzaki-pixfmt`), tracks it, times it on the stage clock and publishes it to the newest-wins mailbox, with a preview tap for the UI, tested over `omuzaki-track-mock`'s `FakeCamera`. The real models and parity with MediaPipe are separate work"
wasm = false
# stage depends on this crate and links it through the generated `link()` list (ADR 0054 section 6).
registers = true

[lints]
workspace = true
