[package]
name = "omuzaki-stream-api"
description = "Contract for streaming and recording: timebases, packets, encoders, muxers, the output trait and the input tap with its frame stamp and tail (spec v3 §25, §39.1; docs/design/record.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
# `register_output!`: output kinds register next to their code (ADR 0054).
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the recording and streaming base types (§25, §39.1; `docs/design/record.md`): `Ticks`, exact `Timebase::rescale`, `Packet` with side data, `ByteMeter`, `StreamError`, stream and encoder specs, the `Encoder`, `Muxer` and `Output` traits, the input track's `InputTap` with its `FrameStamp` and tail contract (`TailMode`, `TailStep`), and the clean output window's `WindowHost` and `PaletteSource` services with their types"
