[package]
name = "omuzaki-connect-api"
description = "Contract for connectors (connectors design D1 to D13): ids, capabilities, the validated TOML manifest, typed requests, outputs, estimates and previews, the Connector trait and register_connector!, the candidates tray and the Connectors service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-http-api = { path = "../omuzaki-http-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the connector contract (CN-01 to CN-05; `docs/design/connectors.md`, ADR 0030): `ConnectorId`, the closed `Capability` set, the validated `ConnectorManifest` (TOML, `ParamDecl`s), one typed `Request` per capability, `Artifact`, `Usage`, `ConnectError`, `Estimate`, the `Preview` and its `widens` rule, `ConnectorConfig` and `Target`, the `Connector` trait with `RunCx` and `Meter`, `register_connector!`, the `Candidate` records and `tray` functions, and the `Connectors` service; HTTP is `omuzaki-http-api`'s"
