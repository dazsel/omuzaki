[package]
name = "omuzaki-obs"
description = "OBS Studio remote control (obs-websocket v5, BR-19): the protocol as data, a client, the connection service and the obs.* ops. Clean-room from the public protocol document."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
schemars.workspace = true
# The client's WebSocket: sync, one connection thread, no async runtime (ws:// to OBS on this machine or the LAN).
tungstenite = "0.30"
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
# The go-live notice reads the cast (`scenes/<id>/cast`) and an imported model's terms (`sources/avatar`).
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }

[features]
# `FakeObs`, the loopback OBS for tests (`testing`): other crates' tests turn it on; off in every normal build.
testing = []

[dev-dependencies]
omuzaki-avatar-api = { path = "../omuzaki-avatar-api" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }
omuzaki-settings-mock = { path = "../omuzaki-settings-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "OBS Studio remote control (obs-websocket v5, BR-19): the protocol as data (`Frame`, `Message`, the handshake, the supported requests and responses, `ObsEvent`, `auth_response`, `EventSubscription`, `CloseCode`), `ObsClient` (one connection thread, requests matched by id, events to subscribers), `ObsService` and the ops `obs.connect`, `obs.disconnect`, `obs.status`, `obs.scenes`, `obs.set_scene`, `obs.stream`, `obs.record`; clean-room from the public protocol document, native only"
# Native only: the client opens a WebSocket to a local app
wasm = false
# The obs.* ops register themselves (ADR 0015, `cargo xtask lint-registers`).
registers = true
