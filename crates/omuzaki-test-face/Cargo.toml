[package]
name = "omuzaki-test-face"
description = "Cross-crate and parity tests of the face area: the Rust face painter and its CPU rasteriser against the JS prototype and Chrome's canvas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Only the face area's implementation crate (`omuzaki-face`) may appear here (`cargo xtask lint-deps`).
[dependencies]
image.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
# The face parity harness (`face_parity`) paints with the real painter and rasterises on the CPU.
omuzaki-face = { path = "../omuzaki-face" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-test = { path = "../omuzaki-test" }

[dev-dependencies]
tempfile.workspace = true
# The score templates' sheets read the library's score files (`score_template_sheets`).
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
toml.workspace = true
# The GPU face rasteriser's tests create a device and wait on it; the mocks stand in for the face and render contracts.
wgpu.workspace = true
pollster.workspace = true
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-face-mock = { path = "../omuzaki-face-mock" }
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-io-mock = { path = "../omuzaki-io-mock" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }

# The generator behind `build.rs`: the `link()` calls come from the dependencies' `registers` flags.
[build-dependencies]
omuzaki-link-build = { path = "../omuzaki-link-build" }

[lints]
workspace = true

# Native only: tests on the build machine
[package.metadata.omuzaki]
kind = "App"
summary = "the face area's cross-crate tests: `face_parity`, the Rust face painter against the JS prototype's isolated face sections (one test per section), and the CPU rasteriser's Chrome-canvas probes"
wasm = false
