[package]
name = "omuzaki-render"
description = "The wgpu renderer: implements the omuzaki-render-api contract with a fixed frame graph, headless or on an existing device (spec v3 §9, §10, §21)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck.workspace = true
inventory.workspace = true
pollster.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
wgpu.workspace = true

# In the browser wgpu wraps JavaScript objects, which are not `Send`; the contract's `Renderer: Send` needs them to be.
# This wgpu feature declares them so on single-threaded WebAssembly (no atomics), which is what the web player is.
# Compile-only for now: running on the web also needs a wall clock, async read-back and async error scopes.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-char-mock = { path = "../omuzaki-char-mock" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the wgpu renderer: `WgpuRenderer` implements the render contract headless or on an existing device, with the fixed frame graph one module per pass, per-pass CPU and GPU timings, and `PaintTarget::native()` for GPU painters; it shades toon materials (ramp with tinted shade, rim, skin, hemisphere, directional and point lights) over the surface colour; the post effects (bloom, depth of field, grain, grade) are in; shadows and blending arrive with their own tasks"
