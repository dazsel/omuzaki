[package]
name = "omuzaki-twitch"
description = "The Twitch adapter (spec v3 BR-10): EventSub over its WebSocket, normalised into the automation events (redeems, chat, follows, raids, cheers, subs) and published into the show's inbox; the twitch.* ops. The token comes from the secret store and never leaves the request header."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-http-api = { path = "../omuzaki-http-api" }
omuzaki-live-api = { path = "../omuzaki-live-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
rustls.workspace = true
rustls-platform-verifier.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The EventSub socket: sync, one connection thread, no async runtime; TLS through rustls and the OS trust store.
tungstenite = "0.30"

[dev-dependencies]
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-http-mock = { path = "../omuzaki-http-mock" }
omuzaki-live-mock = { path = "../omuzaki-live-mock" }
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the Twitch adapter (BR-10): the EventSub WebSocket protocol (welcome, keepalive, notification, reconnect, revocation), the subscriptions it makes through Helix for the scopes the token holds, normalisation into `redeem`, `chat.message`, `follow`, `raid`, `cheer` and `sub`, publishing with the producer's retry buffer, reconnects with backoff, `TwitchService` and the ops `twitch.connect`, `twitch.disconnect`, `twitch.status`; native only"
# Native only: a socket to Twitch.
wasm = false
# The twitch.* ops register themselves (ADR 0015, `cargo xtask lint-registers`).
registers = true
