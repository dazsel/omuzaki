[package]
name = "omuzaki-stream"
description = "Recording and streaming (spec v3 §9, §25; docs/design/record.md): the A/V timeline, the PNG and WAV sinks, the recorder, the replay buffer, FFmpeg encoders, the watchdog and the stream ops, plus the testing kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Every dependency the crate will need is declared here, so later tasks do not have to edit this file. The FFmpeg
# encoders task is the one exception: it adds the optional FFmpeg dependency.
[dependencies]
bytes.workspace = true
# The person's videos folder, where takes go by default (`record/settings.rs`).
directories.workspace = true
hound.workspace = true
image.workspace = true
# Loads libvpx (BSD-3-Clause) at run time for the `WebM` VP9 take with alpha (`src/vp9`).
libloading = "0.9"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
# The `output.window` setting the open op keeps (`src/ops/window.rs`).
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-stream-api = { path = "../omuzaki-stream-api" }
# The live show's shared memory: the remote encoder's frame slots and packet channel (docs/design/supervisor.md §4.3).
omuzaki-shm = { path = "../omuzaki-shm" }
# The monitor's instance nonce (docs/design/supervisor.md §15.1).
getrandom.workspace = true
# Worker logs, read with fixed limits (docs/design/supervisor.md §4.2).
tracing.workspace = true
# The update hold a take or the replay buffer keeps while it runs (`docs/design/updates.md` §7).
omuzaki-update-api = { path = "../omuzaki-update-api" }

# Free space on the take's disk, so a take never fills it (`src/record/disk.rs`).
# Reaping and the parent-death signal of process workers (`src/watchdog`).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# Itself with the testing kit, so integration tests see it and the `fake-worker` binary is built for them.
omuzaki-stream = { path = ".", features = ["testing"] }
criterion.workspace = true
proptest.workspace = true
# A settings service for the `output.window` setting's tests (`tests/ops_window.rs`).
omuzaki-settings-mock = { path = "../omuzaki-settings-mock" }
tempfile.workspace = true
# Writes the `output.window` setting as TOML the way the settings store does (`tests/settings.rs`).
toml.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
# Counts the update holds (`tests/holds.rs`).
omuzaki-update-mock = { path = "../omuzaki-update-mock" }
# Reads the recorded frames and tracks back (`tests/record.rs`).
image.workspace = true
hound.workspace = true

[features]
# The testing kit (`testing`): a fake encoder, a memory muxer and a scripted audio source. Tests always see it.
testing = []
# The FFmpeg encoders and muxers (`ffmpeg`); the native libraries are found at run time.
ffmpeg = []

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "replay"
harness = false

[[bin]]
name = "fake-worker"
path = "src/bin/fake_worker.rs"
required-features = ["testing"]

[lints]
workspace = true

# Native only: native threads, OS outputs and FFmpeg have no wasm32 build.
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the recording and streaming implementation (§25): the A/V timeline, PNG and WAV sinks, the recorder, the replay buffer, FFmpeg encoders behind `ffmpeg`, the watchdog and the stream and record ops, plus the testing kit behind `testing`"
wasm = false
# The window ops register themselves (ADR 0015, `cargo xtask lint-registers`).
registers = true
