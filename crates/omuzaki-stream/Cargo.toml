[package]
name = "omuzaki-stream"
description = "Recording and streaming (spec v3 §9, §25; docs/design/record.md): the A/V timeline, the PNG and WAV sinks, the recorder, the replay buffer, FFmpeg encoders, the watchdog and the stream ops, plus the testing kit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Every dependency the crate will need is declared here, so later tasks do not have to edit this file. The FFmpeg
# encoders task is the one exception: it adds the optional FFmpeg dependency.
[dependencies]
bytes.workspace = true
hound.workspace = true
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-stream-api = { path = "../omuzaki-stream-api" }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }

[features]
# The testing kit (`testing`): a fake encoder, a memory muxer and a scripted audio source. Tests always see it.
testing = []
# The FFmpeg encoders and muxers (`ffmpeg`); the native libraries are found at run time.
ffmpeg = []

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "replay"
harness = false

[[bin]]
name = "fake-worker"
path = "src/bin/fake_worker.rs"
required-features = ["testing"]

[lints]
workspace = true

# Native only: native threads, OS outputs and FFmpeg have no wasm32 build.
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the recording and streaming implementation (§25): the A/V timeline, PNG and WAV sinks, the recorder, the replay buffer, FFmpeg encoders behind `ffmpeg`, the watchdog and the stream and record ops, plus the testing kit behind `testing`"
wasm = false
# The window ops register themselves (ADR 0015, `cargo xtask lint-registers`).
registers = true
