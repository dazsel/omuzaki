[package]
name = "omuzaki-paint"
description = "The illustrator's engine: paintings as layers of marks (brush strokes, ink lines, shapes, gradients, bucket fills, hatching) with blend modes, clipping, masks, groups and alpha-locked marks, rasterised on the CPU, deterministically."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.omuzaki]
kind = "Lib"
summary = "the illustrator's engine: a `Painting` is layers of `Mark`s (brush `Stroke`s with the `Brush` presets, `Shape` fills with solid or gradient paint, `Bucket` fills with gap closing, `Hatch` lines), with blend modes, clipping, masks, groups and alpha-locked marks; `render` rasterises it on the CPU to a premultiplied `Canvas`, deterministically; `stroke_mask` and `shape_mask` give the coverage of one mark to any other canvas (the eye's paint layer); no registrations and no global state, so the face, the puppet and the `paint.*` ops share it"
layer = "lib"

[dependencies]
image.workspace = true
kurbo.workspace = true
libm.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
