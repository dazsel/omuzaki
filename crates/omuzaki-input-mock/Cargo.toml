[package]
name = "omuzaki-input-mock"
description = "Test doubles for the OS input contract: FakeInput (scripted events, pads and binding hits), ReplaySource (recorded input from text) and the conformance suite every MotionFeed passes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-input-api = { path = "../omuzaki-input-api" }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Mock"
summary = "the input mocks (ADR 0060 IN-2): `FakeInput`, one value that is the whole `InputHub` (feeds, control, indicator host, chord store, protected list) with scripted motion events per backend, pad levels, intents and binding hits on a `FakeClock`; `ReplaySource`, a `MotionFeed` over recorded input text (one event per line, zone names, times in seconds, the backend, in drained order) that replays bit-identically; and `conformance::run`, the suite every `MotionFeed` passes (nothing after `up_to`, frames never drop, per-source order kept)"
