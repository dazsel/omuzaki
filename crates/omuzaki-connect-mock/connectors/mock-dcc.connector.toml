# A test fake (connectors design D11): generated in code, free, and never leaves this computer.
id = "mock-dcc"
name = "Mock DCC program"
version = "1.0.0"
transport = "fake"

[[capabilities]]
capability = "dcc"
inputs = ["mesh"]
outputs = ["json"]
max_count = 1

[auth]
kind = "none"

[cost]
model = "free"

[privacy]
leaves_machine = false
destinations = []
sends = ["files"]
retention = "Stays on this computer."
trains_on_inputs = "no"

[licence]
register = "Omuzaki mock connector"
outputs = "vendor_terms"
spdx = "LicenseRef-Omuzaki-Mock"
commercial = "ok"
