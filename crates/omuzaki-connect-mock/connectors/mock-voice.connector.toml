# A test fake (connectors design D11) that plays a hosted, paid service: it is generated in code and sends
# nothing, but its manifest says what a real one would (a key, a price, a destination, a plan rule).
id = "mock-voice"
name = "Mock voices"
version = "1.0.0"
transport = "fake"

[[capabilities]]
capability = "voice"
inputs = ["text", "audio"]
outputs = ["audio"]
max_count = 1

[auth]
kind = "api_key"
secret = "connector/mock-voice"
deliver = { via = "header", name = "x-api-key", scheme = "" }

[cost]
model = "per_unit"
unit = "thousand_chars"
usd_micros = 30000
priced = "2026-10-13"

[privacy]
leaves_machine = true
destinations = ["mock.invalid"]
sends = ["prompt", "audio"]
retention = "It keeps nothing: it is a test fake."
trains_on_inputs = "no"

[licence]
register = "Omuzaki mock connector"
outputs = "vendor_terms"
spdx = "LicenseRef-Omuzaki-Mock"
commercial = "ok"
requires_plan = ["paid"]
