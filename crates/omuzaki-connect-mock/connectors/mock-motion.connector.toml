# A test fake (connectors design D11): generated in code, free, and never leaves this computer.
id = "mock-motion"
name = "Mock motion"
version = "1.0.0"
transport = "fake"

[[capabilities]]
capability = "motion"
inputs = ["text", "video", "motion"]
outputs = ["motion"]
max_count = 1

[auth]
kind = "none"

[cost]
model = "free"

[privacy]
leaves_machine = false
destinations = []
sends = ["prompt", "video", "files"]
retention = "Stays on this computer."
trains_on_inputs = "no"

[licence]
register = "Omuzaki mock connector"
outputs = "vendor_terms"
spdx = "LicenseRef-Omuzaki-Mock"
commercial = "ok"
