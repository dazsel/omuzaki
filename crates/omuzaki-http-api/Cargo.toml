[package]
name = "omuzaki-http-api"
description = "Contract for outgoing HTTP: the HttpTransport trait, request, response and stream types, HttpError and the Cancel handle shared by connectors, net.http and the LLM providers (connectors D13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the one outgoing-HTTP contract (connectors D13): `HttpTransport` (`send`, `open` for streams), `HttpRequest`, `HttpResponse`, `HttpStream`, `HttpError`, and the `Cancel` handle with `NeverCancel` and `CancelFlag`; no network stack; the client is `omuzaki-http`, the fake `omuzaki-http-mock`"
