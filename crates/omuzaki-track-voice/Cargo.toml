[package]
name = "omuzaki-track-voice"
description = "Voice-driven mouth and cues (FE-08, PF-08): microphone samples to voice activity, loudness, onsets and the five visemes, and from them the audio layer and the life layer's cues."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-performer-api = { path = "../omuzaki-performer-api" }

