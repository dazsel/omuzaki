summary = "the in-app assistant's contract (AG-01, ADR 0040): `Assistant` (send, stop, answer, events, transcript, the `/` menu's prompts), `UserMessage` and `ContextChip`, `AssistantEvent` with the `EventHub` that makes Stop's no-output-after-click guarantee, `HostError`, the stored `Entry` kinds, `Conversations` and `RationaleSource` for Explain this; no runtime, no LLM, no MCP; design in `docs/design/agent-runtime.md`"
