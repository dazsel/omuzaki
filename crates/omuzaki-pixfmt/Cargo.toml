[package]
name = "omuzaki-pixfmt"
description = "Camera pixel formats (NV12, YUY2, BGRA, MJPG) to packed RGB8: integer fixed-point, safe Rust, no allocation per frame (PF-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.omuzaki]
kind = "Lib"
summary = "camera pixel formats to packed RGB8 (PF-01): NV12, YUY2, BGRA and strided RGB in Q14 integer maths (BT.601 or BT.709, limited or full range, nearest-neighbour chroma) and MJPG through an allocation-free baseline decoder (libjpeg-exact; `zune-jpeg` for other JPEGs), written into a caller buffer; safe Rust, no allocation per frame in steady state; no `omuzaki-*` dependencies, so the camera, the tracker and the UI preview share it"
layer = "lib"

[dependencies]
thiserror.workspace = true
zune-jpeg.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "convert"
harness = false

[[bench]]
name = "mjpg"
harness = false

[lints]
workspace = true
