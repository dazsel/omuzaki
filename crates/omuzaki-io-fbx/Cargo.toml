[package]
name = "omuzaki-io-fbx"
description = "FBX (binary and ASCII) importer over ufbx against omuzaki-io-api: units, axes and the node hierarchy (spec v3 §27 EX-09)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ufbx.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-io-api = { path = "../omuzaki-io-api" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "FBX as format `fbx`, import only (EX-09): binary 3000+ and ASCII read with ufbx into an `IoScene`, with units, axes and the node hierarchy converted to metres and right-handed Y-up"
registers = true
# ufbx is C compiled by `cc`, and `wasm32-unknown-unknown` has no libc for it (`assert.h` is missing). The web player never imports FBX.
wasm = false
