# Held-out moments for the decision layer (#2348): the same format and character as `moments.toml`, written before
# the rule floor's vocabulary was widened against that set, and never used to tune it. Agreement here is the honest
# number for the floor; agreement on `moments.toml` flatters it.

[[moment]]
moment = "speaking"
state = "person: good evening mochi\nmochi: Good evening! Hello hello, come on in."
face = ["happy"]
gesture = "wave"

[[moment]]
moment = "speaking"
state = "person: we have to go\nmochi: Already? Okay, goodbye, take care out there!"
face = ["happy", "sad"]
gesture = "wave"

[[moment]]
moment = "speaking"
state = "person: show us the dance\nmochi: Alright, let's do the dance, everybody clap along!"
face = ["happy"]
gesture = "dance"

