# The labelled moments the decision layer is measured on (#2348): `cargo test -p omuzaki-performer --test decide_eval`
# for the rule floor, and `cargo run -p omuzaki-cohost --example decide_eval` for a local model or a hosted provider.
#
# Each moment is one ask about the last line of `state`. The character is called Mochi; her expressions are happy, sad,
# surprised, angry, smug and thinking, and her gestures wave, dance, backflip and bow. The labels say what a person
# watching would expect:
# - `face`: the expressions that fit (any of them agrees); `none` means no reaction fits;
# - `gesture`: the gesture she is doing right now, or `none` (a mention without a commitment, or a refusal, is `none`).
# The lines are written for this set, and many carry no keyword, so a model that reads meaning beats the rule floor.

[[moment]]
moment = "speaking"
state = "person: hey mochi!\nmochi: Hi chat! Welcome back, it's so good to see you!"
face = ["happy"]
gesture = "wave"
note = "a greeting is a wave even without 'watch this'"

