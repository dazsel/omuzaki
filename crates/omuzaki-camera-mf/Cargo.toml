[package]
name = "omuzaki-camera-mf"
description = "The Windows Media Foundation camera behind the Camera trait: raw NV12, YUY2, MJPG and RGB32 frames from a synchronous source reader (PF-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-track-api = { path = "../omuzaki-track-api" }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

# Native only: Media Foundation exists on Windows alone; the mode and error tables compile everywhere.
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the Windows camera (PF-01) behind `omuzaki-track-api`'s `Camera`: Media Foundation's synchronous source reader with video processing and converters off, so frames arrive raw (NV12, YUY2, MJPG, RGB32) and borrowed, with the real pitch; `choose_mode` delegates to `CameraFormatRequest::pick`, `map_hresult` turns camera-privacy, unplugged and busy codes into `TrackError`; the tables build and test on every platform, the reader on Windows only"
wasm = false

[lints]
workspace = true
