[package]
name = "omuzaki-speech"
description = "The speech host (spec v3 ML-03): the vad@1 and asr@1 slots, the whisper-ggml runtime, and streaming voice activity, an utterance segmenter and speech recognition on registry sessions, fed lock-free from the audio callback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-core = { path = "../omuzaki-core" }
# Reads the gold pronunciation lexicons (JSON) the text-to-speech G2P looks words up in.
serde.workspace = true
serde_json.workspace = true
# Decodes the public-domain speech clips the `vad@1` and `asr@1` smoke tests fetch (MP3); used unmodified.
symphonia.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Only the `whisper-ggml` runtime (`whisper_runtime.rs`) uses it; the host reaches models through sessions.
whisper-rs.workspace = true

[dev-dependencies]
hound.workspace = true
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-audio-mock = { path = "../omuzaki-audio-mock" }

[lints]
workspace = true

# Native only: whisper.cpp builds from source with CMake and ONNX Runtime has no wasm32 build
[package.metadata.omuzaki]
kind = "Implementation"
registers = true
summary = "the speech host (ML-03) and slots (ML-01): `vad@1` and `asr@1` with smoke tests on pinned public-domain LibriVox fables, the `whisper-ggml` runtime (whisper.cpp through `whisper-rs`), Silero VAD and six Whisper models as shipped `model.toml`s; `SpeechHost::open` takes a `vad@1` and an `asr@1` registry session, reads 16 kHz mono samples through the audio API's lock-free ring (`AudioInput` is also a voice-tap `TapSink`; `push` never allocates), runs the VAD and a streaming segmenter on a VAD thread and transcribes utterances on an ASR thread; bounded drop-oldest queues, events (speech start/end, partial and final transcripts, drops, errors), a slot swapping models counted rather than reported, a configurable language"
wasm = false
