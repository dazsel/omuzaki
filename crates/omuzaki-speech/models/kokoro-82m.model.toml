# Kokoro-82M v1.0 (Apache-2.0) for tts@1, on the kokoro runtime: the ONNX export of the weights (fp32) behind our own
# G2P over misaki's gold lexicons (`docs/research/2026-10-gpl-free-tts.md`). Every file is pinned to a Hugging Face
# revision by size and SHA-256 and never committed. Nothing espeak-derived is fetched: no silver lexicon, no G2P model.
id = "kokoro-82m"
version = "1.0.0"
name = "Kokoro"
slot = "tts@1"
runtime = "kokoro"
providers = ["cpu"]

