# Kokoro has a speed control; the runtime makes expressiveness by scaling the intonation range after synthesis.
[tts]
honours = ["speed", "expressiveness"]

# Kokoro's own trained voices: none imitates a real person or was cloned from a recording. The first is the default.
[[voices]]
id = "af_heart"
languages = ["en-US"]
file = "af_heart.bin"

[[voices]]
id = "af_bella"
languages = ["en-US"]
file = "af_bella.bin"

[[voices]]
id = "am_michael"
languages = ["en-US"]
file = "am_michael.bin"

[[voices]]
id = "bf_emma"
languages = ["en-GB"]
file = "bf_emma.bin"

