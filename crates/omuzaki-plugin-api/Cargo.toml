[package]
name = "omuzaki-plugin-api"
description = "Contract for WASM plugins: the WIT package, the manifest and its checks, the permission summary, the sandbox limits, PluginId, PluginState, PluginError, PluginInfo and the Plugins service (PL-01, ADR 0058)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
thiserror.workspace = true
toml.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-l10n-api = { path = "../omuzaki-l10n-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }

[dev-dependencies]
inventory.workspace = true
# Parses the WIT file in `tests/wit.rs` (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT); never linked into a build.
wit-parser = { version = "0.262", default-features = false }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the plugin contract (PL-01, ADR 0058): the WIT package `omuzaki:plugin` (`WIT_PACKAGE`, `wit/omuzaki-plugin.wit`), `Manifest` (`parse`, `check`, licence classes), the permission summary and update diff, `Approval` and the session `ceiling`, the sandbox `limits` and `CallKind` budgets, `PluginId`, `PluginState`, `FaultKind`, `LogLine`, `PluginError` (converts to `OpError`), `PluginInfo` and the `Plugins` service; no wasmtime"
registers = true
