[package]
name = "omuzaki-plugin-api"
description = "Contract for WASM plugins: the WIT package, PluginId, PluginState, FaultKind, PluginError, PluginInfo and the Plugins service (PL-01, ADR 0058)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }

[dev-dependencies]
serde_json.workspace = true
# Parses the WIT file in `tests/wit.rs` (Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT); never linked into a build.
wit-parser = { version = "0.262", default-features = false }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the plugin contract (PL-01, ADR 0058): the WIT package `omuzaki:plugin` (`WIT_PACKAGE`, `wit/omuzaki-plugin.wit`), `PluginId`, `PluginState`, `FaultKind`, `PluginError` (converts to `OpError`), `PluginInfo` and the `Plugins` service; no wasmtime, no manifest parsing"
