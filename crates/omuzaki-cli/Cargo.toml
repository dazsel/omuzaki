[package]
name = "omuzaki-cli"
description = "The `omuzaki` command: every op as a CLI call, generated from the op registry (spec v3 §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "omuzaki_cli"
path = "src/lib.rs"

[[bin]]
name = "omuzaki"
path = "src/main.rs"

# A copy of `omuzaki` with two demo ops linked in, for the end-to-end tests (`tests/e2e.rs`): the real binary links no
# op crate yet, so it has no op to run. Not part of the product. `required-features` keeps it out of `cargo install`
# and `cargo build --workspace`; the gates (`cargo xtask check`) enable `test-fixtures` to build it for `tests/e2e.rs`.
[[bin]]
name = "omuzaki-fixture"
path = "src/bin/omuzaki-fixture.rs"
required-features = ["test-fixtures"]

[features]
# Builds `omuzaki-fixture` and compiles `tests/e2e.rs`, which runs it. Off by default so installs ship only `omuzaki`.
test-fixtures = []

[dependencies]
clap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
tracing-subscriber.workspace = true
omuzaki-app = { path = "../omuzaki-app" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc = { path = "../omuzaki-doc" }
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-settings = { path = "../omuzaki-settings" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-mcp = { path = "../omuzaki-mcp" }
omuzaki-ops = { path = "../omuzaki-ops" }
omuzaki-io-fbx = { path = "../omuzaki-io-fbx" }
omuzaki-io-gltf = { path = "../omuzaki-io-gltf" }
omuzaki-io-ops = { path = "../omuzaki-io-ops" }
omuzaki-io-vrm = { path = "../omuzaki-io-vrm" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-stage = { path = "../omuzaki-stage" }
omuzaki-stream = { path = "../omuzaki-stream" }
# The `parity.*` ops: a render against its reference, pixel for pixel, until the difference map is 0.
omuzaki-parity = { path = "../omuzaki-parity" }
# The `paint.*` ops: paintings drawn mark by mark.
omuzaki-paint-ops = { path = "../omuzaki-paint-ops" }
# The `short.*` ops: a script to a finished video.
omuzaki-short = { path = "../omuzaki-short" }
# `character.create_from_description` and `character.brief_vocabulary`: a character from words.
omuzaki-brief = { path = "../omuzaki-brief" }
# The `vcam` output kind (`output.start { kind: "vcam" }`).
omuzaki-vcam = { path = "../omuzaki-vcam" }
# The `spout` and `syphon` output kinds (`output.start { kind: "spout" }`).
omuzaki-stream-share = { path = "../omuzaki-stream-share" }
# The audio ops (`audio.devices`, `audio.mic`, `audio.status`).
omuzaki-audio-engine = { path = "../omuzaki-audio-engine" }
# The voice effect kinds (`fx.*`) and the voice preset ops (`audio.fx.*`).
omuzaki-audio-fx = { path = "../omuzaki-audio-fx" }
# The OBS remote-control ops (`obs.*`).
omuzaki-obs = { path = "../omuzaki-obs" }
omuzaki-vts = { path = "../omuzaki-vts" }
# The automation engine and its ops (`show.create`, `automation.*`), and the first-party nodes (`on.event`, `op.run`).
omuzaki-live = { path = "../omuzaki-live" }
omuzaki-live-nodes = { path = "../omuzaki-live-nodes" }
# The Twitch adapter and its ops (`twitch.connect`, `twitch.disconnect`, `twitch.status`).
omuzaki-twitch = { path = "../omuzaki-twitch" }
omuzaki-store = { path = "../omuzaki-store" }
omuzaki-store-api = { path = "../omuzaki-store-api" }
# The render services of a project command (`src/gpu.rs`): a headless renderer that opens on the first render, the
# kit's character builder, and the capabilities the render ops read.
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-render = { path = "../omuzaki-render" }
omuzaki-render-api = { path = "../omuzaki-render-api" }

[dev-dependencies]
# Reads the PNG a headless render exported (`tests/render_preview.rs`).
image.workspace = true
# The library the `library.*` op examples run against (`tests/op_conformance.rs`).
omuzaki-library = { path = "../omuzaki-library" }
omuzaki-library-api = { path = "../omuzaki-library-api" }
tempfile.workspace = true
toml.workspace = true
# The snapshots service the conformance rig stands in for the `project.*` examples (`tests/op_conformance.rs`).
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-history-mock = { path = "../omuzaki-history-mock" }
# The settings the conformance rig gives the `settings.*` examples (`tests/op_conformance.rs`).
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-settings-mock = { path = "../omuzaki-settings-mock" }
# The performer the conformance rig stands in for the `trigger.*` examples (`tests/op_conformance.rs`).
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
# The voice catalog and voice commands the conformance rig gives the `voice.*` and `voice_commands.*` examples.
omuzaki-l10n-api = { path = "../omuzaki-l10n-api" }
omuzaki-performer-api = { path = "../omuzaki-performer-api" }
omuzaki-speech = { path = "../omuzaki-speech" }
# The end-to-end design test (tests/design_e2e.rs, #2216) builds the designed character to compare it after a reopen.
omuzaki-char-api = { path = "../omuzaki-char-api" }
# ...and runs the same design as an MCP client over `omuzaki mcp`'s server.
rmcp = { workspace = true, features = ["client"] }
# ...and renders its turnaround through the deterministic mock renderer.
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }
# ...and writes it as a VRM through the io crates the binary links, reading it back.
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-io-mock = { path = "../omuzaki-io-mock" }
# The tests call these crates' API, not only their registrations (`design_e2e.rs` exports and renders through them,
# `op_conformance.rs` stands in the stage's perform and input hosts), so they are dev-dependencies too: a change to one
# of them runs every test here, while `link_only` below still describes the binary.
omuzaki-io-ops = { path = "../omuzaki-io-ops" }
omuzaki-io-vrm = { path = "../omuzaki-io-vrm" }
omuzaki-stage = { path = "../omuzaki-stage" }
# The effect service the conformance rig gives the `stage.effect.*` examples.
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
# The expressions and the camera ids the idle hosts list.
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-track-api = { path = "../omuzaki-track-api" }
# The output window and palette the conformance rig gives the `output.window.*` examples (`tests/window_host/`).
omuzaki-stream-api = { path = "../omuzaki-stream-api" }
# `script.run` through the real executor over an in-memory document (`tests/script_run.rs`, #1220).
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-script = { path = "../omuzaki-script" }
# The mock audio engine the conformance rig gives the `audio.*` and `record.*` examples.
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-audio-mock = { path = "../omuzaki-audio-mock" }
# The scripted transport the conformance rig's Twitch service stands on (it never makes a call: the examples dry-run).
omuzaki-http-mock = { path = "../omuzaki-http-mock" }
# The broadcast end-to-end test (`tests/live_e2e.rs`): a fake OBS, the secret store a token is read from, and a fake
# Twitch EventSub socket.
omuzaki-obs = { path = "../omuzaki-obs", features = ["testing"] }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }
omuzaki-live-api = { path = "../omuzaki-live-api" }
omuzaki-http-api = { path = "../omuzaki-http-api" }
tungstenite = "0.30"
# The palette gate beside the link gate (`tests/palette_gate.rs`, #1635): the check over every linked part kind, and the
# mock face painter its builds paint with.
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-face-mock = { path = "../omuzaki-face-mock" }
# The registration scan behind the link gate (`tests/registrations.rs`, ADR 0015).
xtask = { path = "../../xtask" }

# The generator behind `build.rs`: the `link()` calls come from the dependencies' `registers` flags.
[build-dependencies]
omuzaki-link-build = { path = "../omuzaki-link-build" }

[lints]
workspace = true

# Native only: the desktop command-line binary
[package.metadata.omuzaki]
kind = "App"
summary = "the `omuzaki` command: ops, help, run (dry-run/JSON), undo/redo, all generated from the op registry"
wasm = false
# Held only to link their registrations in (`omuzaki_cli::link`, ADR 0015); this crate's source calls none of their API.
# A change to one of them runs just `tests/registrations.rs` here (`cargo xtask check --affected`), not every test.
link_only = ["omuzaki-brief", "omuzaki-paint-ops", "omuzaki-io-fbx", "omuzaki-io-gltf", "omuzaki-io-ops", "omuzaki-io-vrm", "omuzaki-short", "omuzaki-stage", "omuzaki-stream", "omuzaki-stream-share", "omuzaki-vcam", "omuzaki-audio-engine", "omuzaki-audio-fx", "omuzaki-obs", "omuzaki-vts", "omuzaki-live", "omuzaki-live-nodes", "omuzaki-twitch"]
