[package]
name = "omuzaki-llm"
description = "The LLM providers (llm-api D5, D6, D11): Anthropic Messages and OpenAI-compatible chat over one HTTP, SSE and retry stack, with the dated price data, model listing and probing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls", "system-proxy", "stream", "http2"] }
serde.workspace = true
serde_json.workspace = true
sse-stream.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
toml.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-llm-api = { path = "../omuzaki-llm-api" }

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio = { workspace = true, features = ["net", "time", "test-util"] }
omuzaki-llm-mock = { path = "../omuzaki-llm-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
# Native only: tokio, a TLS stack with a C crypto library and a socket per turn
wasm = false
kind = "Implementation"
registers = true
summary = "the LLM providers (llm-api D5, D6, D11): the Anthropic Messages and OpenAI-compatible chat clients over one HTTP, SSE and retry stack on the host's tokio runtime, the dated price data, model listing and probing; tested against loopback fake servers, no network in CI"
