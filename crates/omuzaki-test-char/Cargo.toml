[package]
name = "omuzaki-test-char"
description = "Cross-crate and parity tests of the character area: the character crate against the JS prototype, and the character with its rig and animation runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Tests only: every dependency is a dev-dependency, so the library stays empty and links nothing. Only the character
# area's implementation crates (`omuzaki-char`, `omuzaki-rig`, `omuzaki-anim`) may appear here (`cargo xtask lint-deps`).
[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
omuzaki-anim = { path = "../omuzaki-anim" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-char-mock = { path = "../omuzaki-char-mock" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-rig = { path = "../omuzaki-rig" }
omuzaki-test = { path = "../omuzaki-test" }

[lints]
workspace = true

# Native only: tests on the build machine
[package.metadata.omuzaki]
kind = "App"
summary = "the character area's cross-crate tests: `omuzaki-char` against the JS prototype's dumps (body loft, head, ears, auto weights, hair tubes, head parts) and the character posed through `omuzaki-rig` and `omuzaki-anim`"
wasm = false
