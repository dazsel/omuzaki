[package]
name = "omuzaki-history-api"
description = "Contract for the write-ahead journal and project snapshots: history entries, the journal sink, the history export, snapshot refs and the Snapshots service (spec v3 §6, §7, §29; ADR 0021)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inventory.workspace = true
# `rc`: entries and exports share records and steps through `Arc` so that appending one is O(1).
schemars.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the journal and snapshot contract (§6, §7, §29; ADR 0021): `HistoryEntry` and the `JournalSink` the executor appends to, `HistoryExport` (undo and redo stacks as data), snapshot ids, refs and triggers, the `Snapshots` service (with `take_at` for any `StateRef`), branches and points (`branch`: `BranchId`, `BranchName`, `Point`, `Contains`, the `Branches` lane manager and its events) and state references with the `BranchStore` and `HistoryView` services (`state`; VC-02, ADR 0025), and `register_derived_path!` for caches that snapshots leave out; design in `docs/design/journal.md`"
