[package]
name = "omuzaki-ai"
description = "The model registry's implementation: the verified file cache, shipped and user models, slot sessions, the sandboxed worker user models run in, and the model.* ops (spec v3 §16 ML-01, ML-13, ADR 0016, ADR 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-update-api = { path = "../omuzaki-update-api" }

# The model worker's limits (src/sandbox/limits.rs): safe setrlimit and setpriority on unix, a Job Object on Windows.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
registers = true
summary = "the model registry's implementation: `VerifiedCache` (the `FileSource` every pinned file comes from), `Registry` (shipped and user models, install with smoke test, acknowledgement, the consent hook, selection, slot sessions that swap and fall back), `sandbox` (the worker process user models are probed, tested and run in, with memory, priority and lifetime limits) and the `model.*` ops; design in `docs/design/ai-api.md`, ADR 0016, ADR 0017"
