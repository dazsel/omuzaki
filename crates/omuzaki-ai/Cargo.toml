[package]
name = "omuzaki-ai"
description = "The model registry's implementation, starting with the verified file cache: pinned, size-capped, hash-checked, resumable downloads (spec v3 §16 ML-01, ADR 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-update-api = { path = "../omuzaki-update-api" }

# The model worker's limits (src/sandbox/limits.rs): safe setrlimit and setpriority on unix, a Job Object on Windows.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "Implementation"
summary = "the model registry's implementation, so far the verified file cache `VerifiedCache` (the `FileSource` every pinned file comes from: ordered URLs with fall-through, bounded streamed SHA-256, resume from a kept partial file, atomic store), `sha256_file` and `model_ref`; design in `docs/design/ai-api.md` §8, ADR 0017"
