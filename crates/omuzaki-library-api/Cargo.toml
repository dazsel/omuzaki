[package]
name = "omuzaki-library-api"
description = "Contract for the library (spec v3 §28, ADR 0019): item ids and versions, the manifest and its canonical hash, recipes, publishers, application records, item sources and the Library service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
proptest.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the library contract (§28, ADR 0019): `ItemId`, `Version`, `VersionReq`; the `ItemManifest` with its canonical BLAKE3 hash, `check` and publisher `verify`; `ItemRights`; pure recipe `expand` and `check_ops`; `ApplicationRecord`; `ItemSource` with `register_library_source!`; the `Library` service trait with `Query`, `SearchPage`, `ItemInfo`, `Facets`; append-only manifest `migrations`; design in `docs/design/library.md`"
registers = true
