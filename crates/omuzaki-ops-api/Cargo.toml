[package]
name = "omuzaki-ops-api"
description = "Contract for the operation layer: typed ops, scopes, plans, errors and self-registration (spec v3 §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }

# Random names for temporary files (`CanonicalPath::replace`). Not on wasm, where nothing is opened and getrandom would
# need a JavaScript backend.
[target.'cfg(any(unix, windows))'.dependencies]
getrandom.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the op contract (§6): `Op`, `Plan`, scopes and grants, structured errors, self-registration with `register_op!`, and the `Runner` trait every surface (MCP, CLI, UI, scripts) calls"
