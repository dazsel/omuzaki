[package]
name = "omuzaki-stage"
description = "The character stage (spec v3 §8, §18, §19): uploads a built character to the renderer and runs the rig, the runtimes and the face painter each frame, plus scene recipes, character sheets and the render ops. App layer: it wires the implementation crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

# Every dependency the crate will need is declared here, so later work does not have to edit this file. A change that needs one that is missing adds it.
[dependencies]
ab_glyph.workspace = true
harfrust.workspace = true
image.workspace = true
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-bidi.workspace = true
unicode-normalization.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-avatar = { path = "../omuzaki-avatar" }
omuzaki-avatar-api = { path = "../omuzaki-avatar-api" }
omuzaki-budget = { path = "../omuzaki-budget" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-metrics-api = { path = "../omuzaki-metrics-api" }
# An imported character's avatar, rebuilt from its stored original when it goes on a stage (`body`).
omuzaki-io-ops = { path = "../omuzaki-io-ops" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-settings-api = { path = "../omuzaki-settings-api" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }
omuzaki-track = { path = "../omuzaki-track" }
omuzaki-track-api = { path = "../omuzaki-track-api" }
omuzaki-track-voice = { path = "../omuzaki-track-voice" }
# Linked for their self-registrations (part kinds, retargets, ...) and for the rig, which the frame loop calls directly.
omuzaki-anim = { path = "../omuzaki-anim" }
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-face = { path = "../omuzaki-face" }
omuzaki-rig = { path = "../omuzaki-rig" }
# The wgpu renderer backend, linked only with the `wgpu` feature (R1).
omuzaki-render = { path = "../omuzaki-render", optional = true }

[features]
# The wgpu renderer. The stage is written against `dyn Renderer`, so nothing here needs it; the feature links the
# `omuzaki-render` backend. Tests use the render mock.
wgpu = ["omuzaki-render"]

# The build script declares the feature modules from their folders (ADR 0054 §1) and writes the `link()` calls from the
# dependencies' `registers` flags (§6).
[build-dependencies]
omuzaki-embed = { path = "../omuzaki-embed" }
omuzaki-link-build = { path = "../omuzaki-link-build" }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true
tempfile.workspace = true
omuzaki-ai = { path = "../omuzaki-ai" }
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-anim-mock = { path = "../omuzaki-anim-mock" }
omuzaki-char-mock = { path = "../omuzaki-char-mock" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-face-mock = { path = "../omuzaki-face-mock" }
# The real fetcher under the font download test (`tests/font_download.rs`).
omuzaki-http = { path = "../omuzaki-http" }
# A kit character exported to VRM (and written as FBX) and imported back as an avatar: the bring-your-own-model path
# without a third-party file (`tests/avatar_stage.rs`, `tests/fbx_avatar.rs`).
omuzaki-io-fbx = { path = "../omuzaki-io-fbx" }
omuzaki-io-vrm = { path = "../omuzaki-io-vrm" }
# CIELAB for the measurement rig's flatness test (`tests/measure_flat.rs`).
omuzaki-measure = { path = "../omuzaki-measure" }
# The executor the history thumbnails follow (`tests/history_thumbs.rs`).
omuzaki-ops = { path = "../omuzaki-ops" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }
omuzaki-settings = { path = "../omuzaki-settings" }
omuzaki-stream = { path = "../omuzaki-stream" }
omuzaki-store-mock = { path = "../omuzaki-store-mock" }
omuzaki-track-mock = { path = "../omuzaki-track-mock" }
omuzaki-track-net = { path = "../omuzaki-track-net" }
# The steady-clock load `examples/live_times.rs --steady` runs in front of each frame.
wgpu.workspace = true
# The registration scan behind the link gate (`tests/registrations.rs`, ADR 0015).
xtask = { path = "../../xtask" }

# One bench target per hot path. A target needs its file to exist, so the skeleton declares it up front; the task named
# in the file's `//!` line fills it.
[[bench]]
name = "frame"
harness = false

[[bench]]
name = "scene"
harness = false

[[bench]]
name = "perform"
harness = false

# The live loop's frame times on a real GPU against the spec §10 budgets: the kit character and its imported VRM.
[[example]]
name = "live_times"
required-features = ["wgpu"]

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
generated-mods = ["src", "src/ops"]
summary = "not in the workspace yet: the character stage, which uploads a `BuiltCharacter` to the renderer and runs the rig, the runtimes and the face painter each frame. It is wiring, not an API+impl pair, because the UI, the CLI, the web player and the golden runner all link the same wiring"
registers = true
