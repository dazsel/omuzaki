# The interior of the reference shorts (#2416): a daylit study. The subject stands at the origin facing +Z; the back
# wall is 2.2 m behind them. Every prop's id gets the `set-` prefix when the preset is applied.
title = "Study"
summary = "A daylit study: planked floor, panelled walls, a full bookcase, a window with curtains letting in daylight, a desk and chair, a floor lamp, a plant and a rug. Pairs with the dev-warm rig."
light_rig = "dev-warm"
tags = ["interior", "day", "warm"]

[backdrop]
kind = "gradient"
top = "#3a3029"
bottom = "#6a5646"

[ground]
kind = "none"

[props.room]
kind = "room"
params = { width = 5.5, depth = 5.0, height = 2.8 }
position = [0.0, 0.0, 0.3]

[props.rug]
kind = "rug"
params = { width = 2.6, length = 1.8 }
position = [0.0, 0.0, 0.2]

[props.bookcase]
kind = "shelf"
params = { width = 1.3, height = 2.2, depth = 0.34, shelves = 6, books = 0.85, seed = 4 }
position = [-1.45, 0.0, -2.2]

[props.window]
kind = "window"
params = { width = 1.3, height = 1.45, panes = [2, 3] }
position = [1.35, 0.9, -2.2]

[props.desk]
kind = "desk"
params = { width = 1.3, depth = 0.6 }
position = [1.35, 0.0, -1.85]

[props.chair]
kind = "chair"
params = { cushion = "#7a3e3a" }
position = [1.25, 0.0, -1.2]
rotation = [200.0, 0.0, 0.0]

[props.mug]
kind = "cup"
position = [1.75, 0.75, -1.8]

[props.lamp]
kind = "lamp"
position = [-2.35, 0.0, -1.6]

[props.plant]
kind = "plant"
params = { height = 1.1, leaves = 26, seed = 8 }
position = [2.4, 0.0, -0.9]
