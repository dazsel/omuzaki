# dev-warm: transcribed from the golden manifest (spec.rig of its cases). Lighting numbers only.
# Three.js units (render-api D10): the numbers are copied, not rescaled.
name = "dev-warm"
source = "prototype dev viewer, warm rig"
title = "Warm studio"
summary = "A warm key on mid grey, for checking skin and warm palettes."
tags = ["warm", "grey"]
exposure = 1.0
background = "#8a8f99"
skin_floor = 0.42

[hemisphere]
sky = "#ffe6c8"
ground = "#403028"
intensity = 1.3

[key]
