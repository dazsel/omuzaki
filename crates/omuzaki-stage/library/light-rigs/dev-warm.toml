position = [1.2, 1.5, 2.2]

[key.shadow]
map_size = 1024
left = -0.8
right = 0.8
top = 0.8
bottom = -0.8
near = 0.1
far = 8.0
bias = -0.0004
normal_bias = 0.01

[bloom]
strength = 0.32
radius = 0.5
threshold = 0.92
