# short-rim: our own design (#2394), not transcribed from anything. Lighting numbers only.
# The look of a talking-head short: a character close to the lens against near-black, a soft warm key from the front
# left so the face reads cleanly at phone size, and two warm back spots high behind each shoulder that edge the hair and
# the silhouette in gold, so the figure separates from the dark without a set. Three.js units (render-api D10), with
# positions in metres from the feet of a character of the reference height (0.966 m).
name = "short-rim"
source = "our own design: a close talking-head shot against black with a warm rim"
title = "Short rim"
summary = "A soft warm key, a gold rim from two back spots and a near-black background: close talking-head shorts and reaction clips."
tags = ["short", "warm", "rim", "dark", "face", "vertical"]
exposure = 1.0
background = "#07060a"
skin_floor = 0.42
# The two back spots edge the silhouette in their colour (render-api `Scene::back_light_rim`).
back_light_rim = 3.2

[hemisphere]
sky = "#3a3040"
ground = "#0a0808"
intensity = 0.35

# Soft and frontal, a little left and above the lens: the face is the subject and must read at phone size.
[key]
colour = "#fff2e8"
intensity = 1.6
position = [-0.7, 1.6, 2.0]

[key.shadow]
map_size = 1024
left = -0.6
right = 0.6
top = 1.2
bottom = 0.2
near = 0.1
far = 6.0
bias = -0.0004
normal_bias = 0.01

# A low warm fill from the right, so the shadow side of the face stays warm instead of falling to black.
[fill]
colour = "#ffd7b8"
intensity = 0.45
position = [1.6, 0.8, 1.6]

[[spot]]
# Gold from high behind the left shoulder: the rim on the hair's left edge and the shoulder.
id = "back_left"
colour = "#ffc46b"
intensity = 5.0
position = [-0.9, 1.5, -1.3]
target = [0.0, 0.8, 0.0]
cone = 14.0
penumbra = 0.3
distance = 6.0

[[spot]]
# Its twin behind the right shoulder, a touch paler, so the two edges aren't a mirror.
id = "back_right"
colour = "#ffd894"
intensity = 4.2
position = [0.9, 1.6, -1.3]
target = [0.0, 0.8, 0.0]
cone = 14.0
penumbra = 0.3
distance = 6.0

# A soft glow on the rim, kept tight so the black stays black.
[bloom]
strength = 0.3
radius = 0.35
threshold = 0.9
