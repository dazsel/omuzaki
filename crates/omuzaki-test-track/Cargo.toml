[package]
name = "omuzaki-test-track"
description = "Cross-crate tests of the track area: the face tracker on its real graphs through the ONNX Runtime wrapper, the speech models through the registry, the per-frame bench, and the `track_roi` timing probe for the reference machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Tests only: every dependency is a dev-dependency, so the library stays empty and links nothing. Only the track area's
# implementation crates (`omuzaki-track`, `omuzaki-track-*`, `omuzaki-speech`), the runtimes its real graphs load through (`omuzaki-ai-ort`,
# `omuzaki-ai-litert`), the registry the speech models install through (`omuzaki-ai`) and the mic's effects whose
# effect on lip sync it measures (`omuzaki-audio-fx`) may appear here
# (`cargo xtask lint-deps`).
[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
# The runtime-archive source of the tests checks the pinned SHA-256 (ADR 0017).
sha2.workspace = true
# The timing probe test writes the `manifest.json` of a stand-in model folder.
serde_json.workspace = true
# The LibriVox reading and the golden clip are 16 kHz WAV in the speech data folder.
hound.workspace = true
omuzaki-ai = { path = "../omuzaki-ai" }
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-ai-litert = { path = "../omuzaki-ai-litert" }
omuzaki-ai-ort = { path = "../omuzaki-ai-ort" }
# `tests/denoise.rs`: the mic's noise suppression measured on the voice line and through the microphone mouth.
omuzaki-audio-fx = { path = "../omuzaki-audio-fx" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
# Kokoro through the TTS host into a mock engine's feeds, as the performer speaks.
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-audio-mock = { path = "../omuzaki-audio-mock" }
# The TTS host driving the AI mouth over the mock engine's real play log.
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-track-voice = { path = "../omuzaki-track-voice" }
omuzaki-performer-api = { path = "../omuzaki-performer-api" }
omuzaki-core = { path = "../omuzaki-core" }
# The voice-command evaluation reads the listener's events through a sink of its own.
omuzaki-live-api = { path = "../omuzaki-live-api" }
omuzaki-speech = { path = "../omuzaki-speech" }
omuzaki-track = { path = "../omuzaki-track" }
# The body frame the body tracker solves into.
omuzaki-track-api = { path = "../omuzaki-track-api" }
# A recorded video as a tracking input, through the webcam tracker and offline (`tests/video.rs`, #2585).
omuzaki-track-video = { path = "../omuzaki-track-video" }

# The timing probe's CPU-per-frame column on Windows (`GetProcessTimes`).
[target.'cfg(windows)'.dev-dependencies]
windows.workspace = true

[[bench]]
name = "track"
harness = false

[lints]
workspace = true

# Native only: tests on the build machine
[package.metadata.omuzaki]
kind = "App"
summary = "the track area's real-model tests and bench: the speech models installed through the registry with their smoke tests and run by the speech host (Silero within 1e-3 of the Python reference, Whisper end to end), gated on OMUZAKI_SPEECH_MODELS, and the `speech_host_bench` example; the face tracker on the MediaPipe graphs through ONNX Runtime (opens, finds no face in a flat frame, repeatable bit for bit, allocates nothing in Rust in the steady state and stays under a measured native ceiling, refuses a damaged file), gated on OMUZAKI_TRACK_MODELS, and the `track_roi_timing` probe example the nightly cross-builds for Windows"
wasm = false
