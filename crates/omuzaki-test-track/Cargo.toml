[package]
name = "omuzaki-test-track"
description = "Cross-crate tests of the track area: the face tracker on its real graphs through the ONNX Runtime wrapper, and the per-frame bench."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Tests only: every dependency is a dev-dependency, so the library stays empty and links nothing. Only the track area's
# implementation crate (`omuzaki-track`) and the ONNX Runtime wrapper its real graphs load through (`omuzaki-ai-ort`)
# may appear here (`cargo xtask lint-deps`).
[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
# The runtime-archive source of the tests checks the pinned SHA-256 (ADR 0017).
sha2.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-ai-ort = { path = "../omuzaki-ai-ort" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-track = { path = "../omuzaki-track" }

[[bench]]
name = "track"
harness = false

[lints]
workspace = true

# Native only: tests on the build machine
[package.metadata.omuzaki]
kind = "App"
summary = "the track area's real-model tests and bench: the face tracker on the MediaPipe graphs through ONNX Runtime (opens, finds no face in a flat frame, repeatable bit for bit, allocates nothing in the steady state on the Rust and the native side, refuses a damaged file), gated on OMUZAKI_TRACK_MODELS"
wasm = false
