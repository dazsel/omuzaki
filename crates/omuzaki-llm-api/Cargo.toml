[package]
name = "omuzaki-llm-api"
description = "Contract for calling an LLM (llm-api D1 to D5, D8, D10): LlmClient, provider-neutral messages, the pull-based TurnStream, Usage and prices, the pre-request Ledger bound, LlmError, Cancel and register_llm_provider!."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
inventory.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the LLM seam (CN-09, AG-01, AP-03; ADR 0032): `LlmClient` and the blocking pull-based `TurnStream` (`try_next`, `next_timeout`, `usage_so_far`, `collect`), `TurnRequest` with the provider-neutral append-only `Message`s and `ContentBlock`s, `LlmEvent`, `Cancel`, `Usage`, `MicroUsd`, the dated `PriceTable`, the offline `Ledger::bound`, `LlmError`, and `register_llm_provider!` with `ProviderConfig`; `SecretRef`, `SecretLabel`, `SecretStore` are local stand-ins until #281 and #784 land; no network stack, no runtime; design in `docs/design/llm-api.md`"
