# Pose "wave-left": the left-hand version of wave-right, authored by hand so a test can hold the mirror of one to the
# other. Same degrees, the sides swapped and Y and Z negated (the mirror rule of HumanoidPose::mirrored).
id = "wave-left"
summary = "Left arm raised with the elbow bent and the hand open, the right arm relaxed down: a hello."
tags = ["greeting", "arm"]
mirrorable = true

[bones]
rightUpperArm = [0.0, 0.0, 65.0]
rightLowerArm = [0.0, 10.0, 0.0]
leftUpperArm = [0.0, -20.0, 20.0]
leftLowerArm = [0.0, 0.0, 85.0]
leftHand = [0.0, 0.0, -10.0]
head = [0.0, 8.0, 4.0]

[hands.left]
shape = "open"
weight = 1.0
