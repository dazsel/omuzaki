# Gesture "fidget-hand" (fidget). Arm angles are degrees in a person's terms: raise, forward, twist, elbow, pronate, wrist,
# shrug and reach (see crates/omuzaki-anim/src/body/arm.rs). `lead` is the gesturing hand, `other` the second hand of a
# two-handed gesture (the lead's mirror when left out); `chest` is pitch, yaw toward the lead side and roll, in degrees.
id = "fidget-hand"
summary = "A hand opened and closed at the side: restless fingers."
kind = "fidget"
hands = "one"
strokes = [1, 1]

[prep.lead]
raise = 10.0
forward = 8.0
twist = 14.0
elbow = 28.0
pronate = 0.0
wrist = 6.0
hand = "spread"

[stroke]
chest = [0.0, 0.0, 0.0]

[stroke.lead]
raise = 10.0
forward = 8.0
twist = 14.0
elbow = 30.0
pronate = 0.0
wrist = 10.0
hand = "fist"
