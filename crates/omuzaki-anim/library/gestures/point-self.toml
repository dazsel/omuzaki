# Gesture "point-self" (deictic). Arm angles are degrees in a person's terms: raise, forward, twist, elbow, pronate, wrist,
# shrug and reach (see crates/omuzaki-anim/src/body/arm.rs). `lead` is the gesturing hand, `other` the second hand of a
# two-handed gesture (the lead's mirror when left out); `chest` is pitch, yaw toward the lead side and roll, in degrees.
id = "point-self"
summary = "An open hand brought to the chest: me, I, mine."
kind = "deictic"
hands = "one"
strokes = [1, 1]

[prep.lead]
raise = 10.0
forward = 22.0
twist = 46.0
elbow = 104.0
pronate = 10.0
wrist = 0.0
hand = "open"

[stroke]
chest = [-2.0, -6.0, 0.0]

[stroke.lead]
raise = 8.0
forward = 24.0
twist = 62.0
elbow = 118.0
pronate = 20.0
wrist = -6.0
hand = "flat"
