# Gesture "fidget-shoulders" (fidget). Arm angles are degrees in a person's terms: raise, forward, twist, elbow, pronate, wrist,
# shrug and reach (see crates/omuzaki-anim/src/body/arm.rs). `lead` is the gesturing hand, `other` the second hand of a
# two-handed gesture (the lead's mirror when left out); `chest` is pitch, yaw toward the lead side and roll, in degrees.
id = "fidget-shoulders"
summary = "The shoulders rolled up and back: loosening up."
kind = "fidget"
hands = "both"
strokes = [1, 1]

[prep.lead]
raise = 8.0
forward = 4.0
twist = 10.0
elbow = 16.0
pronate = 0.0
wrist = 4.0
shrug = 8.0
reach = 6.0
hand = "rest"

[stroke]
chest = [-2.0, 0.0, 0.0]

[stroke.lead]
raise = 8.0
forward = -2.0
twist = 8.0
elbow = 14.0
pronate = 0.0
wrist = 4.0
shrug = 12.0
reach = -8.0
hand = "rest"
