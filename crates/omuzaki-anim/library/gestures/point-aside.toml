# Gesture "point-aside" (deictic). Arm angles are degrees in a person's terms: raise, forward, twist, elbow, pronate, wrist,
# shrug and reach (see crates/omuzaki-anim/src/body/arm.rs). `lead` is the gesturing hand, `other` the second hand of a
# two-handed gesture (the lead's mirror when left out); `chest` is pitch, yaw toward the lead side and roll, in degrees.
id = "point-aside"
summary = "An open hand toward the side: over there, that."
kind = "deictic"
hands = "one"
strokes = [1, 1]

[prep.lead]
raise = 16.0
forward = 30.0
twist = 12.0
elbow = 80.0
pronate = -20.0
wrist = 0.0
hand = "open"

[stroke]
chest = [0.0, 14.0, 0.0]

[stroke.lead]
raise = 42.0
forward = 34.0
twist = -22.0
elbow = 32.0
pronate = -40.0
wrist = -6.0
hand = "open"
