[package]
name = "omuzaki-update-fs"
description = "The real file and clock seams of the updater: `StdDisk` over std::fs and `SystemWallClock` over SystemTime, shared by the updater and the launcher (SE-08)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-update-api = { path = "../omuzaki-update-api" }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
omuzaki-update-mock = { path = "../omuzaki-update-mock" }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
layer = "lib"
wasm = false
summary = "`StdDisk`, the `Disk` seam over std::fs (fsync of files and folders, free space), and `SystemWallClock`; the one place the updater and the launcher touch the real disk and clock"
