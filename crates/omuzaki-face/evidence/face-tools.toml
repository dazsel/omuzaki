# Render cases for `tools/ci/evidence.py` (format at the top of that file): the face spine's tools and library.

[[case]]
name = "channel-sweep"
description = "face.channel.sweep on the default face at 387 px: the rest face, then every ARKit-52 channel and anime extra pushed to its far end (a dead control has its name in red)."
env = { OMUZAKI_FACE_EVIDENCE_DIR = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-face", "--test", "evidence_tools", "--", "--exact", "render_the_channel_sweep_when_asked"] },
]
images = ["channel-sweep.png"]

[[case]]
name = "expression-library"
description = "The built-in expression library on the default face at 28, 56 and 112 px, blown up with whole pixels (an expression in a pair the range test says reads the same has its name in red)."
env = { OMUZAKI_FACE_EVIDENCE_DIR = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-face", "--test", "evidence_tools", "--", "--exact", "render_the_expression_library_when_asked"] },
]
images = ["library-28px.png", "library-56px.png", "library-112px.png"]
