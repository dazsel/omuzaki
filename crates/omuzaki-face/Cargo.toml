[package]
name = "omuzaki-face"
description = "The procedural face: FaceSystem (mapping, painter, fingerprints), the real painter, CPU and GPU rasterisers, face ops, the expression library and the expression bakers (spec v3 §19; contracts omuzaki-face-api, omuzaki-render-api)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# Every dependency the crate will need is declared here, so later work does not have to edit this file. Impl crates may not depend on `omuzaki-test`, an App crate.
[dependencies]
image.workspace = true
inventory.workspace = true
libm.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1.20"
thiserror.workspace = true
toml.workspace = true
vello.workspace = true
wgpu.workspace = true
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-io-api = { path = "../omuzaki-io-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
criterion.workspace = true
# The oracle the stroker's tests compare with (the port of Skia's stroker this one is a port of); tests only.
tiny-skia.workspace = true
proptest.workspace = true
pollster.workspace = true
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-face-mock = { path = "../omuzaki-face-mock" }
omuzaki-ops = { path = "../omuzaki-ops" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }
omuzaki-store-mock = { path = "../omuzaki-store-mock" }

# One bench target per hot path. A target needs its file to exist, so the skeleton declares them up front; the task named
# in each file's `//!` line fills it.
[[bench]]
name = "face_system"
harness = false

[[bench]]
name = "gpu_face"
harness = false

[[bench]]
name = "cheeks_nose_marks"
harness = false

[[bench]]
name = "mouth_shape"
harness = false

[[bench]]
name = "mouth_interior"
harness = false

# The CPU rasteriser on the Chrome-parity probe drawings and the overlap drawings.
[[bench]]
name = "raster_scan"
harness = false

[build-dependencies]
omuzaki-embed = { path = "../omuzaki-embed" }

[lints]
workspace = true

# The eyes section alone: the aperture and the eye white; later eye pieces add to the same bench.
[[bench]]
name = "painter_eyes"
harness = false

[package.metadata.omuzaki]
kind = "Implementation"
generated-mods = ["src/ops"]
summary = "the procedural face (spec v3 §19, CB-20..25): turns the channel bus into painted face layers, on the contracts of `omuzaki-face-api` (what the face does) and `omuzaki-render-api` (where the pixels go)"
registers = true
