# Eye presets (#2469): `face.eyes.preset` sets a character's eyes to one of these, and `face.eyes.randomise` starts
# from one. Each `eyes` table is merged over the default eye (the prototype's), so a preset names only what differs;
# everything it leaves out returns to the default. Colours are written here too, but the op keeps the character's own
# iris and lash colours unless it is asked not to.

[[preset]]
id = "kit"
summary = "The kit's default (new characters start with it): open, round eyes with a fibred iris, a window catchlight, strand lashes and a wet line"

[preset.eyes.aperture]
roundness = 0.6
upper_height = 0.75
lower_depth = 0.6
tilt = 0.05

[preset.eyes.iris]
drop = 0.0
height = 0.9
detail = { fibres = { strength = 0.55 }, collarette = { strength = 0.6 }, flecks = { strength = 0.4 }, limbal = { strength = 0.65 }, pupil_glow = 0.35 }

[preset.eyes.highlights]
shape = "window"
size = 0.3
offset = [0.26, 0.3]
caustic = 0.55

[preset.eyes.sclera]
corner_shade = 0.55
caruncle = 0.6
waterline = 0.6

[preset.eyes.lash.strands]
upper = { count = 26 }
lower = { count = 10, opacity = 0.7 }

[[preset]]
