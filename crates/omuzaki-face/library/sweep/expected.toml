side = "right"

[eyeLookOutLeft]
measure = "pupil_x.left"
sign = 1
side = "left"

[eyeLookOutRight]
measure = "pupil_x.right"
sign = -1
side = "right"

[eyeLookUpLeft]
measure = "gaze_y"
sign = 1

[eyeLookUpRight]
measure = "gaze_y"
sign = 1

[eyeSquintLeft]
measure = "eye_open.left"
sign = -1
side = "left"

[eyeSquintRight]
