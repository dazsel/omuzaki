# What each face channel is expected to do to the face (#229), read by `face.channel.sweep`'s direction check
# (`omuzaki_face::preview::direction`). One table per channel, in the bus's own names; the test fails on a face channel
# with no entry.
#
# - `measure`: the quantity of the paint parameters it moves (the list is `Measure` in `preview/direction.rs`):
#   `eye_open.<side>` (the aperture: openness, less a blink or an arc), `lower_lid.<side>`, `brow_height.<side>`,
#   `brow_inner` (both brows' inner ends), `gaze_y`, `pupil_x.<side>` (+ toward the character's left),
#   `mouth_open`, `mouth_wide`, `mouth_round`, `mouth_press`, `mouth_pucker`, `mouth_shift` (+ toward the character's
#   left), `corner.<side>` (mouth-corner lift), `teeth_upper`, `tongue`, `fangs`, `blush`, `cheek_puff`, `sweat`, and
#   `effect.<name>` for the eye effects.
# - `sign`: +1 when raising the channel raises the measure, -1 when it lowers it.
# - `side`: `left` or `right` (the character's) when the painted change must fall mostly on that half of the face.
#   Left out when the change is central or shared by both sides (the gaze, the mouth's width).
# - `inert = true`: the contract gives the channel no painted effect (`UNMAPPED`); nothing is checked.

[browDownLeft]
measure = "brow_height.left"
sign = -1
side = "left"

[browDownRight]
measure = "brow_height.right"
sign = -1
side = "right"

[browInnerUp]
measure = "brow_inner"
sign = 1

[browOuterUpLeft]
measure = "brow_height.left"
sign = 1
side = "left"

[browOuterUpRight]
measure = "brow_height.right"
sign = 1
side = "right"

[cheekPuff]
