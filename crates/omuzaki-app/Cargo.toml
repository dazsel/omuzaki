[package]
name = "omuzaki-app"
description = "The app core (spine, CLAUDE.md section 1): one in-process core per open project (the executor, the open document, the event stream, jobs, the journal) that the studio, MCP and the CLI share. App layer: it wires the implementation crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "time"] }
tracing.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc = { path = "../omuzaki-doc" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-mcp = { path = "../omuzaki-mcp" }
omuzaki-ops = { path = "../omuzaki-ops" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-store = { path = "../omuzaki-store" }
omuzaki-library-api = { path = "../omuzaki-library-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
omuzaki-library-mock = { path = "../omuzaki-library-mock" }
omuzaki-store-mock = { path = "../omuzaki-store-mock" }
proptest.workspace = true
rmcp = { workspace = true, features = ["client"] }
schemars.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
registers = true
# Native only: the MCP server, the loopback port and the bridge run on tokio's network stack.
wasm = false
summary = "the app core: `AppCore` opens a project through its journal (recovering after a crash, history restored), runs one executor and serves it to the studio, the CLI and MCP (HTTP port, in-app link); `close` ends the session cleanly"
