[package]
name = "omuzaki-take-api"
description = "Contract for takes (SH-01, ADR 0052): the chunk and file constants, record kinds and flags, the header, State and Event records, the TakeSource reader trait and report, TakeError, and register_take_state! for live-state providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "takes (SH-01, ADR 0052): the `.input` format's constants, `RecordKind`, `ChunkFlags` and `ChunkHeader`, `TakeHeader`, the `State` and `Event` records, the `TakeSource` reader trait with `TakeReport` and `TakeError`, and `register_take_state!` for live-state providers; types only, the codec is `omuzaki-take`; design in `docs/design/takes.md` §5"

[dependencies]
inventory.workspace = true
# `rc`: a `HistoryEntry` shares its op record through `Arc`.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
thiserror.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }

[lints]
workspace = true
