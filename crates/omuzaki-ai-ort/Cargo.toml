[package]
name = "omuzaki-ai-ort"
description = "The `onnx` runtime: pinned ONNX Runtime builds fetched on first use, providers tried in order with the CPU last, no spin-waiting, custom ops and external data refused (spec v3 §16 ML-01, ADR 0016, ADR 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The provider features only compile ort's CUDA / DirectML / Core ML / WebGPU option types; `load-dynamic` (the workspace
# setting) means no ONNX Runtime is linked or downloaded at build time.
ort = { workspace = true, features = ["cuda", "directml", "coreml", "webgpu"] }
tracing.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-ai-native = { path = "../omuzaki-ai-native" }
omuzaki-core = { path = "../omuzaki-core" }

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
zip.workspace = true
hound.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Native only: ONNX Runtime has no wasm32 build
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the `onnx` runtime (§16 ML-01): pinned Microsoft ONNX Runtime builds fetched through `FileSource` on first use, providers tried in order with the CPU last, no spin-waiting, custom-op domains and external data refused before ONNX Runtime sees the bytes; native only; design in `docs/design/ai-api.md` §9, ADR 0017"
registers = true
wasm = false
