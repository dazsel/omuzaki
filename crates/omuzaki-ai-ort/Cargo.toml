[package]
name = "omuzaki-ai-ort"
description = "The `onnx` runtime: pinned ONNX Runtime builds fetched on first use, providers tried in order with the CPU last, no spin-waiting, custom ops and external data refused (spec v3 §16 ML-01, ADR 0016, ADR 0017)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The provider features only compile ort's CUDA / DirectML / Core ML / WebGPU option types; `load-dynamic` (the workspace
# setting) means no ONNX Runtime is linked or downloaded at build time.
ort = { workspace = true, features = ["cuda", "directml", "coreml", "webgpu"] }
flate2.workspace = true
tar.workspace = true
tempfile.workspace = true
tracing.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-core = { path = "../omuzaki-core" }
zip.workspace = true

[dev-dependencies]
hound.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Native only: ONNX Runtime has no wasm32 build
[package.metadata.omuzaki]
wasm = false
