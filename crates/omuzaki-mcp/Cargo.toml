[package]
name = "omuzaki-mcp"
description = "MCP server exposing every op as a tool, over stdio or a local Streamable HTTP port (spec v3 §11)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
constant_time_eq.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# The stdio bridge's client for the studio's loopback port (`bridge`); `rustls` only so a client can be built when
# another crate in the binary turns on reqwest's rustls without a provider.
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time"] }
tokio-util.workspace = true
tracing.workspace = true
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-history-api = { path = "../omuzaki-history-api" }
omuzaki-library-api = { path = "../omuzaki-library-api" }
omuzaki-metrics-api = { path = "../omuzaki-metrics-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }

[dev-dependencies]
# The clients the integration tests talk to the server with: in-process, and over a real loopback port.
proptest.workspace = true
# reqwest (a normal dependency) is built without a crypto provider; the test helper installs `ring` before any client.
# `test-util` pauses tokio's clock, which is how the timeout tests run without sleeping (see `limits.rs`).
tokio = { workspace = true, features = ["test-util"] }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
tempfile.workspace = true
omuzaki-history-mock = { path = "../omuzaki-history-mock" }
omuzaki-ops-mock = { path = "../omuzaki-ops-mock" }
omuzaki-store-mock = { path = "../omuzaki-store-mock" }

[build-dependencies]
omuzaki-embed = { path = "../omuzaki-embed" }

[lints]
workspace = true

# Native only: an MCP server on tokio, over stdio or a local TCP port (the web player talks to agents differently)
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the MCP server (§11): every registered op is a tool, served over stdio, a local Streamable HTTP port or an in-process link; every connection is a session in the executor's registry; long jobs are tasks; resources and recipes; native only, over `omuzaki-ops-api`, `omuzaki-doc-api`, `omuzaki-library-api` and `omuzaki-store-api`"
wasm = false
registers = true
