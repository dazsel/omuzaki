[package]
name = "omuzaki-model-worker"
description = "The sandboxed worker process that models the person adds are probed, tested and run in: it links the runtimes and serves the registry over a pipe (ADR 0016 rule 4, docs/design/ai-api.md §9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-ai = { path = "../omuzaki-ai" }
omuzaki-ai-litert = { path = "../omuzaki-ai-litert" }
omuzaki-ai-ort = { path = "../omuzaki-ai-ort" }

[dev-dependencies]
tempfile.workspace = true
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-ai-mock = { path = "../omuzaki-ai-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
summary = "`omuzaki-model-worker`, the sandboxed process user models run in: it links the `onnx` and `tflite` runtimes (no network stack) and serves `omuzaki_ai::sandbox` over stdin and stdout under the registry's memory, priority and lifetime limits; native only"
wasm = false
