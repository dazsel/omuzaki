# The file fence for a crate that registers ops (docs/design/ops-api.md section 5): its code reaches files only
# through `OpCtx::fs_access` and the `CanonicalPath` it returns, whose opens never follow a link. Opening by path would
# let a link swapped in after the check redirect the open. A legitimate use (a test fixture, the CLI reading what the
# person typed) is allowed where it is, with `#[allow(clippy::disallowed_methods)]` and a one-line reason.
#
# Clippy reads this file instead of the workspace's `clippy.toml`, so the workspace settings are repeated first;
# `crates/omuzaki-ops-api/tests/fs_fence.rs` checks that every op crate has this fence and that the copies agree.

# Workspace settings (from the root `clippy.toml`).
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
    { path = "std::fs::File::open", reason = "ops reach files only through `OpCtx::fs_access` and the `CanonicalPath` it returns; allow a legitimate use locally, with its reason" },
    { path = "std::fs::File::create", reason = "ops reach files only through `OpCtx::fs_access` and the `CanonicalPath` it returns; allow a legitimate use locally, with its reason" },
    { path = "std::fs::File::create_new", reason = "ops reach files only through `OpCtx::fs_access` and the `CanonicalPath` it returns; allow a legitimate use locally, with its reason" },
