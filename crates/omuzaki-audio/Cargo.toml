[package]
name = "omuzaki-audio"
description = "The speech host (spec v3 ML-03): streaming Silero VAD, an utterance segmenter and Whisper on a worker thread, fed lock-free from the audio callback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ort.workspace = true
thiserror.workspace = true
whisper-rs.workspace = true

[dev-dependencies]
hound.workspace = true

[lints]
workspace = true

# Native only: whisper.cpp builds from source with CMake and ONNX Runtime has no wasm32 build
[package.metadata.omuzaki]
privacy = "capture"
kind = "Implementation"
summary = "the speech host (ML-03): `SpeechHost` takes 16 kHz mono samples through a lock-free ring (`AudioInput::push` never allocates), runs Silero VAD (`ort`, `load-dynamic`) and a streaming segmenter on a VAD thread, and transcribes utterances with Whisper (`whisper-rs`) on an ASR thread; bounded drop-oldest queues, events (speech start/end, partial and final transcripts, drops, errors), a configurable language, and a model catalogue (URL, size, SHA-256; never committed). Models via `OMUZAKI_SPEECH_MODELS` in tests"
wasm = false
