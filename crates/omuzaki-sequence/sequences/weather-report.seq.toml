world_position = [{ t = 1.08, v = [0.2, 1.35, 0.3] }, { t = 1.75, v = [0.9, 1.6, 2.6], ease = "quad-in" }]
world_rotation = [{ t = 1.08, v = [0.0, 0.0, -80.0] }, { t = 1.75, v = [540.0, 40.0, 260.0], ease = "linear" }]
