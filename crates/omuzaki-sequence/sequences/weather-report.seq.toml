]
face = [
  { t = 0.0, set = { happy = 0.55 } },
  { t = 0.8, set = { smug = 0.8 }, ease = "quad-out" },
  { t = 1.15, set = { happy = 0.9, wink = 0.7 }, ease = "back-out" },
  { t = 1.5, set = { happy = 0.6 } },
]

[[shot.prop]]
id = "desk"
kind = "news-desk"
params = { width = 2.6, height = 1.08, depth = 0.6, curve = 70.0, colour = "#6f4fd8", top = "#efe8ff", accent = "#8fe6ff", accent_height = 0.06, accent_glow = true }
