  { t = 1.12, bones = { leftUpperArm = [10.0, 0.0, -62.0], rightUpperArm = [-55.0, 15.0, 30.0], leftLowerArm = [0.0, -70.0, 0.0], rightLowerArm = [0.0, 25.0, 0.0], head = [-2.0, -4.0, 2.0], chest = [0.0, 8.0, 0.0] }, hands = { left = "rest", right = "open" }, ease = "back-out" },
