# A 7.5 s vertical news gag, made only with Omuzaki's own tools: an anchor at the OMU NEWS desk flicks a cue card at
# the lens, a WEATHER UPDATE stinger whips in, the forecast cuts outside where she chars and screams in a cloud of
# toxic goo while the hourly forecast's bars grow, a second stinger, and back at the desk she calmly wraps up.
#
# Render: omuzaki run sequence.render '{"source": {"path": "sequences/weather-report.seq.toml"}}'
# Stills: omuzaki run sequence.stills '{"source": {"path": "sequences/weather-report.seq.toml"}, "times": [0.5, 1.2, 1.8, 2.6, 3.4, 4.3, 5.5, 7.0]}'
title = "OMU NEWS weather report"
duration = 7.5
fps = 24
size = [1080, 1920]
seed = 7

# ---------------------------------------------------------------------------------------------------------------------
# The studio behind the desk shots: a blue wall, light panels and the OMU NEWS logo, drawn behind the 3D frame so the
# anchor's head overlaps the logo.

[[layer]]
id = "studio-wall"
depth = "back"
draw = { kind = "rect", w = 1200, h = 2000 }
fill = "#3f6fe0"
fill_to = "#b4b8f4"

[[layer]]
id = "studio-panel-left"
depth = "back"
draw = { kind = "rect", w = 150, h = 1500 }
x = 0.12
y = 0.36
skew = 14.0
fill = "#ffffff1e"

[[layer]]
id = "studio-panel-right"
depth = "back"
draw = { kind = "rect", w = 90, h = 1500 }
x = 0.9
y = 0.36
skew = 14.0
fill = "#ffffff16"

[[layer]]
id = "studio-glow"
depth = "back"
draw = { kind = "ellipse", w = 1400, h = 700 }
x = 0.5
y = 0.5
fill = "#ffffff26"

[[layer]]
id = "logo-omu"
depth = "back"
draw = { kind = "text", text = "OMU", size = 250, weight = 800, align = "left" }
x = 0.06
y = 0.13
anchor = [0.0, 0.5]
skew = 12.0
fill = "#ffffff"
stroke = { colour = "#2c3fa0", width = 6.0 }
scale = [{ t = 0.0, v = 1.0 }, { t = 7.5, v = 1.04, ease = "linear" }]

[[layer]]
id = "logo-news"
depth = "back"
draw = { kind = "text", text = "NEWS", size = 250, weight = 800, align = "left" }
x = 0.24
y = 0.25
anchor = [0.0, 0.5]
skew = 12.0
fill = "#ffffff"
stroke = { colour = "#2c3fa0", width = 6.0 }
scale = [{ t = 0.0, v = 1.0 }, { t = 7.5, v = 1.04, ease = "linear" }]

[[layer]]
id = "logo-tick-top"
depth = "back"
draw = { kind = "polygon", points = [[0, 0], [70, -30], [50, 40]] }
x = 0.05
y = 0.06
fill = "#ff3d8b"

[[layer]]
id = "logo-tick-bottom"
depth = "back"
draw = { kind = "polygon", points = [[0, 0], [-70, 30], [-50, -40]] }
x = 0.95
y = 0.33
fill = "#ff3d8b"

