pose = [
  { t = 0.0, bones = { leftUpperArm = [10.0, 0.0, -62.0], rightUpperArm = [10.0, 0.0, 62.0], leftLowerArm = [0.0, -70.0, 0.0], rightLowerArm = [0.0, 70.0, 0.0], head = [0.0, -4.0, 3.0] }, hands = { left = "rest", right = "rest" } },
  { t = 0.45, bones = { leftUpperArm = [10.0, 0.0, -62.0], rightUpperArm = [20.0, -8.0, 58.0], leftLowerArm = [0.0, -70.0, 0.0], rightLowerArm = [0.0, 95.0, 0.0], head = [-3.0, 4.0, -3.0] }, hands = { left = "rest", right = "grip" }, ease = "back-out" },
