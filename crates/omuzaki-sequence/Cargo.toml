[package]
name = "omuzaki-sequence"
description = "Sequences (spec v3 §26 SH-02, SH-05): keyframed animation of whole scenes, shot by shot, rendered headless to video: cameras, characters (poses, faces, talking, surface fx), props, toon volumes and motion-graphics layers on one timeline, with an easing library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph.workspace = true
omuzaki-anim = { path = "../omuzaki-anim" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
# The video writer (VP9 in WebM) shorts already use.
omuzaki-short = { path = "../omuzaki-short" }
omuzaki-stage = { path = "../omuzaki-stage" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-store-api = { path = "../omuzaki-store-api" }
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Motion-graphics layers: paths, fills, strokes and gradients rasterised on the CPU.
tiny-skia.workspace = true
toml.workspace = true
tracing.workspace = true

[build-dependencies]
omuzaki-link-build = { path = "../omuzaki-link-build" }

[dev-dependencies]
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-render = { path = "../omuzaki-render" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "App"
registers = true
# The video writer loads libvpx at run time.
wasm = false
summary = "sequences: the `sequence.*` ops over keyframed scenes (shots with cameras, characters, props, toon volumes and surface fx, plus motion-graphics layers), rendered headless to WebM or PNG; and the prop kinds `news-desk`, `skyline`, `cloud-bank` and `card`"
