[package]
name = "omuzaki-update-api"
description = "Contract for the updater: the Updater service, release and status types, holds, update events, the install state and layout, and the Disk and WallClock seams (SE-08; ADR 0035)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omuzaki-core = { path = "../omuzaki-core" }
schemars = { workspace = true, features = ["semver1"] }
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.omuzaki]
kind = "API"
summary = "the updater contract (SE-08, ADR 0035): the `Updater` and `ModelCatalogue` services, `Release`, `UpdateStatus`, `UpdateError`, RAII `Hold`s that defer a restart, bounded `UpdateEvents`, `state.toml` as `State` (unknown keys kept) with its `Watermark`, the install `Layout`, and the `Disk` and `WallClock` seams that the launcher and the updater share; no I/O; design in `docs/design/updates.md`"
