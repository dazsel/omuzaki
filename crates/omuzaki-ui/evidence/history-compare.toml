# Comparing two History steps (spine/ui, #425): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "history-compare"
description = "The History panel over the real executor and the kit with the compare window open on two steps (spine/ui, #425): before and after split over the steps' pictures, the share of the picture that changed, and the parameter diff grouped by part with Select. The pictures are synthetic discs from a fake thumbnailer. At 1366x768 and 1920x1080."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "history_compare", "--", "--ignored", "--exact", "history_compare_evidence"] },
]
images = ["history-compare-1366x768.png", "history-compare-1920x1080.png"]
