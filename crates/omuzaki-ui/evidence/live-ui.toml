# The Live UI (change #2041): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "live-workspace"
description = "The Live workspace (#305) in its three states (idle, calibrating, face lost) at 1366x768 and 1920x1080, dark palette, 100% scale: rendered headless by tests/live_viewport.rs over the app's own pipeline: the kit character on the stage, moved by the perform thread, beside the Live panel reading the app's ops."
env = { OMUZAKI_LIVE_EVIDENCE_DIR = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "live_viewport", "evidence_pictures_of_idle_calibrating_and_face_lost_with_the_character_on_the_stage", "--", "--exact"] },
]
images = ["live-idle-1366x768.png", "live-idle-1920x1080.png", "live-calibrating-1366x768.png", "live-calibrating-1920x1080.png", "live-face-lost-1366x768.png", "live-face-lost-1920x1080.png"]
