# The Live UI (change #2041): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "live-workspace"
description = "The Live workspace (#305) in its three states (idle, calibrating, tracking lost) at 1366x768 and 1920x1080, dark palette, 100% scale: rendered headless by tests/live_workspace.rs on the story runner, which shows each state's perform.status."
env = { OMUZAKI_LIVE_EVIDENCE_DIR = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "live_workspace", "evidence_pictures_of_idle_calibrating_and_tracking_lost", "--", "--exact"] },
]
images = ["live-idle-1366x768.png", "live-idle-1920x1080.png", "live-calibrating-1366x768.png", "live-calibrating-1920x1080.png", "live-tracking-lost-1366x768.png", "live-tracking-lost-1920x1080.png"]
