# The edit panels (change #2043): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "edit-panels"
description = "The Build workspace's edit panels (#2043): the outliner, the viewport and the inspector docked as shell.md section 2 lays them out, at 1920x1080 and 1366x768, dark palette, the mock character open with its head selected. The viewport is the stage's render on the shared wgpu device."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "viewport", "--", "--ignored", "--exact", "edit_panels_evidence"] },
]
images = ["build-1920x1080.png", "build-1366x768.png"]
