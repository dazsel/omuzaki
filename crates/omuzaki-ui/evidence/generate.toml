# Generation in the studio (spine/ui): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "generate"
description = "Generation over the connector host's fake generators (spine/ui, #1185, #1009, #1010, #1011): Settings, Connectors, Generators with the paid generator's privacy notes, licence, plan and saved key; and the Generated tray with pending, accepted and rejected images, their chips and rights badges, and the cost card before a paid run. At 1366x768 and 1920x1080."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "generate", "--", "--ignored", "--exact", "generate_evidence"] },
]
images = ["generators-1366x768.png", "generated-1366x768.png", "generators-1920x1080.png", "generated-1920x1080.png"]
