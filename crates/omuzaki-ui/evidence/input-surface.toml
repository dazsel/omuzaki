# The OS input surface (spine/ui, #1820, #1822, #752): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "input-surface"
description = "The capture indicator over the Input panel (spine/ui, #1820, #1822, part of #752), on the scripted hub: off with nothing bound; a keyboard that needs a permission, with the locomotion preset added and the gamepad unavailable; on with a learnt chord. At 1366x768 and 1920x1080."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "input_surface", "--", "--ignored", "--exact", "input_surface_evidence"] },
]
images = ["input-surface-1366x768.png", "input-surface-1920x1080.png"]
