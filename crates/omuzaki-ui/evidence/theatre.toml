# The Build Theatre (spine/ui, spec §13, `shell.md` section 11): its own case file, so no other change edits it
# (tools/ci/evidence.py).

[[case]]
name = "theatre"
description = "The Theatre workspace over a real agent session and the kit (spine/ui, TH-01..04, TH-06..11): the plan board with each item's status and steps, the stage with the session's controls, budget meter and a note being drawn on the character, the compare strip with the reference, the previous step and the current one pictured by the stage's thumbnailer, and the steps list with reasons and a failed gate card. At 1920x1080 and 1366x768."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "theatre", "--", "--ignored", "--exact", "theatre_evidence"] },
]
images = ["theatre-1920x1080.png", "theatre-1366x768.png"]
