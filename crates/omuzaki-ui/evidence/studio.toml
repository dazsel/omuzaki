# The studio as the app starts it (spine/ui): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "studio"
description = "The studio as a first-time user opens it (spine/ui): the real shell over the real executor, the Build workspace at 1920x1080 and 1366x768, dark palette, the kit sample character open in the viewport, and an agent's edit listed in History."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "studio", "--", "--ignored", "--exact", "studio_evidence"] },
]
images = ["studio-1920x1080.png", "studio-1366x768.png"]

[[case]]
name = "first-run"
description = "The whole app on a first start (spine/ui): the live slice with the project's sample character on the Perform stage, and the setup flow beside it at 1366x768, on its welcome and its character step."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "studio", "--", "--ignored", "--exact", "first_run_evidence"] },
]
images = ["first-run-welcome-1366x768.png", "first-run-character-1366x768.png"]

[[case]]
name = "palette"
description = "The command palette over the real studio at 1366x768 (spine/ui, #153): results for \"rename\", then character.rename's form generated from its schema with the open character filled in, the live dry-run preview, and the MCP tool it is the same as."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "studio", "--", "--ignored", "--exact", "palette_evidence"] },
]
images = ["palette-search-1366x768.png", "palette-form-1366x768.png"]
