# The studio as the app starts it (spine/ui): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "studio"
description = "The studio as a first-time user opens it (spine/ui): the real shell over the real executor, the Build workspace at 1920x1080 and 1366x768, dark palette, the kit sample character open in the viewport, and an agent's edit listed in History."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "studio", "--", "--ignored", "--exact", "studio_evidence"] },
]
images = ["studio-1920x1080.png", "studio-1366x768.png"]

[[case]]
name = "first-run"
description = "First run over the real studio (spine/ui, #1184, #989): the setup flow beside the Perform stage with the sample character, through every step (welcome, character, input with a camera, no camera, a refused camera and a downloading tracker, calibrate, output, go live) at 1366x768 and 1920x1080, in dark, light and high contrast, the pseudo-locale and 200%. The setup host is simulated so every state renders; the Live panel beside it shows the CI machine as it is."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "studio", "--", "--ignored", "--exact", "first_run_evidence"] },
]
images = [
    "setup-welcome-dark-1366x768.png",
