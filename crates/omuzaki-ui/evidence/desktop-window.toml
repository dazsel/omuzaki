# The Live workspace's window modes (spine/ui): its own case file, so no other change edits it (tools/ci/evidence.py).

[[case]]
name = "desktop-window"
description = "The output window's modes in the Live workspace (spine/ui, #758, #759, over #2310's ops): the window open on the desktop at half the output, with its opacity slider and every click passing through, which names the way back."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "live_workspace", "--", "--exact", "on_the_desktop_opens_the_desktop_window_and_its_clicks_change_in_place"] },
]
images = ["live-desktop-1366x1600.png"]
