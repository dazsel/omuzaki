# Render cases for `tools/ci/evidence.py`: CI renders each at the PR's base and at the PR, for pull requests labelled
# `visual` (.github/workflows/visual-evidence.yml). The format is documented at the top of tools/ci/evidence.py.
#
# Both cases run the design-system gallery headless (src/bin/gallery.rs): fixed size (the whole gallery, 1680 points
# wide), one pixel per point (gallery-pseudo: 1680×4000, see its description), the theme and scale named by the flags, so the pictures are the same on every run.

[[case]]
name = "gallery-themes"
description = "The design-system gallery in its three palettes (dark, light, high contrast) at 100% scale: every component in every state."
steps = [
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--screenshots", "{out}"] },
]
images = ["dark.png", "light.png", "high-contrast.png"]

[[case]]
name = "gallery-pseudo"
description = "The gallery in the pseudo-locale (accented, 40% longer text) at 200% UI scale, dark palette, the top 4000 points (the whole gallery at this scale is over the GPU's texture limit): finds hard-coded text and layouts that cannot take longer text or large scale."
steps = [
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--size", "1680,4000", "--screenshot", "{out}/pseudo-200.png"] },
]
images = ["pseudo-200.png"]
