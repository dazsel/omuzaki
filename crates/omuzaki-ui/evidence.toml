# Render cases for `tools/ci/evidence.py`: CI renders each at the PR's base and at the PR, for pull requests labelled
# `visual` (.github/workflows/visual-evidence.yml). The format is documented at the top of tools/ci/evidence.py.
#
# Both cases run the design-system gallery headless (src/bin/gallery.rs): fixed size (the whole gallery, 1680 points
# wide), the theme and scale named by the flags, so the pictures are the same on every run.

[[case]]
name = "gallery-themes"
description = "The design-system gallery in its three palettes (dark, light, high contrast) at 100% scale: every component in every state."
steps = [
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--screenshots", "{out}"] },
]
images = ["dark.png", "light.png", "high-contrast.png"]

[[case]]
name = "gallery-pseudo"
description = "The gallery in the pseudo-locale (accented, 40% longer text) at 200% UI scale, dark palette, one section per picture; a section too tall for one GPU texture is cut into parts (--part I/N). Foundations 1 part, Controls 4, Display 2, Feedback 3, Composites 1: every part is under half a texture."
steps = [
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "foundations", "--screenshot", "{out}/pseudo-200-foundations.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "controls", "--part", "1/4", "--screenshot", "{out}/pseudo-200-controls-1of4.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "controls", "--part", "2/4", "--screenshot", "{out}/pseudo-200-controls-2of4.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "controls", "--part", "3/4", "--screenshot", "{out}/pseudo-200-controls-3of4.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "controls", "--part", "4/4", "--screenshot", "{out}/pseudo-200-controls-4of4.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "display", "--part", "1/2", "--screenshot", "{out}/pseudo-200-display-1of2.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "display", "--part", "2/2", "--screenshot", "{out}/pseudo-200-display-2of2.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "feedback", "--part", "1/3", "--screenshot", "{out}/pseudo-200-feedback-1of3.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "feedback", "--part", "2/3", "--screenshot", "{out}/pseudo-200-feedback-2of3.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "feedback", "--part", "3/3", "--screenshot", "{out}/pseudo-200-feedback-3of3.png"] },
    { run = ["cargo", "run", "--locked", "-p", "omuzaki-ui", "--bin", "gallery", "--", "--pseudo", "--scale", "200", "--group", "composites", "--screenshot", "{out}/pseudo-200-composites.png"] },
]
images = ["pseudo-200-foundations.png", "pseudo-200-controls-1of4.png", "pseudo-200-controls-2of4.png", "pseudo-200-controls-3of4.png", "pseudo-200-controls-4of4.png", "pseudo-200-display-1of2.png", "pseudo-200-display-2of2.png", "pseudo-200-feedback-1of3.png", "pseudo-200-feedback-2of3.png", "pseudo-200-feedback-3of3.png", "pseudo-200-composites.png"]

[[case]]
name = "edit-panels"
description = "The Build workspace's edit panels (#2043): the outliner, the viewport and the inspector docked as shell.md section 2 lays them out, at 1920x1080 and 1366x768, dark palette, the mock character open with its head selected. The viewport is the stage's render on the shared wgpu device."
env = { OMUZAKI_EVIDENCE_OUT = "{out}" }
steps = [
    { run = ["cargo", "test", "--locked", "-p", "omuzaki-ui", "--test", "viewport", "--", "--ignored", "--exact", "edit_panels_evidence"] },
]
images = ["build-1920x1080.png", "build-1366x768.png"]
