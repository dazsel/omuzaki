[package]
name = "omuzaki-ui"
description = "The Omuzaki desktop app's UI: the design system (tokens, themes, components, gallery); panels and the shell arrive in their own modules (docs/design/ux/)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["capture"]
# Headless rendering of the gallery to PNG (and the pixel screenshots in tests) through egui_kittest's wgpu renderer.
capture = ["dep:egui_kittest", "dep:image"]

[dependencies]
clap.workspace = true
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
egui_tiles.workspace = true
egui_kittest = { workspace = true, optional = true }
image = { workspace = true, optional = true }
inventory.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
omuzaki-anim = { path = "../omuzaki-anim" }
# The model registry and the `model.*` ops, over the HTTP fetcher (live/wiring/inputs.rs).
omuzaki-ai = { path = "../omuzaki-ai" }
omuzaki-ai-api = { path = "../omuzaki-ai-api" }
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
# The live slice's microphone (the `audio.*` ops and the engine a take's mic track taps), OBS control and the virtual
# camera (`live/wiring/app.rs`).
omuzaki-audio-api = { path = "../omuzaki-audio-api" }
omuzaki-audio-engine = { path = "../omuzaki-audio-engine" }
omuzaki-obs = { path = "../omuzaki-obs" }
omuzaki-secrets = { path = "../omuzaki-secrets" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }
omuzaki-vts = { path = "../omuzaki-vts" }
omuzaki-vcam = { path = "../omuzaki-vcam" }
omuzaki-char = { path = "../omuzaki-char" }
omuzaki-char-api = { path = "../omuzaki-char-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-doc = { path = "../omuzaki-doc" }
omuzaki-doc-api = { path = "../omuzaki-doc-api" }
omuzaki-face-api = { path = "../omuzaki-face-api" }
omuzaki-http = { path = "../omuzaki-http" }
omuzaki-l10n-api = { path = "../omuzaki-l10n-api" }
omuzaki-ops = { path = "../omuzaki-ops" }
omuzaki-ops-api = { path = "../omuzaki-ops-api" }
omuzaki-render = { path = "../omuzaki-render" }
omuzaki-render-api = { path = "../omuzaki-render-api" }
omuzaki-setup = { path = "../omuzaki-setup" }
omuzaki-stage = { path = "../omuzaki-stage" }
omuzaki-stage-api = { path = "../omuzaki-stage-api" }
omuzaki-stream = { path = "../omuzaki-stream" }
omuzaki-stream-api = { path = "../omuzaki-stream-api" }
# The studio's live inputs: the webcam from the install, the phone link and VMC out (live/wiring/app.rs).
omuzaki-track = { path = "../omuzaki-track" }
omuzaki-track-api = { path = "../omuzaki-track-api" }
omuzaki-track-net = { path = "../omuzaki-track-net" }
omuzaki-ui-api = { path = "../omuzaki-ui-api" }
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true

# Unix only: signal a probe's whole process group when it ends
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# The webcam on Windows, for the studio's inputs (live/wiring/inputs.rs).
omuzaki-camera-mf = { path = "../omuzaki-camera-mf" }

[dev-dependencies]
egui_kittest.workspace = true
image.workspace = true
omuzaki-anim-mock = { path = "../omuzaki-anim-mock" }
omuzaki-char-mock = { path = "../omuzaki-char-mock" }
omuzaki-doc-mock = { path = "../omuzaki-doc-mock" }
omuzaki-ops-mock = { path = "../omuzaki-ops-mock" }
omuzaki-render-mock = { path = "../omuzaki-render-mock" }
omuzaki-track-mock = { path = "../omuzaki-track-mock" }
omuzaki-ui-mock = { path = "../omuzaki-ui-mock" }
omuzaki-vts = { path = "../omuzaki-vts", features = ["testing"] }
tempfile.workspace = true

[lints]
workspace = true

# Native only: an eframe desktop window and GPU readback for screenshots
[package.metadata.omuzaki]
kind = "App"
summary = "the desktop UI: `ds`, the design system (tokens and the three themes with a contrast test, fonts and Phosphor icons, the components with AccessKit labels and their own words in a `Strings` table with a pseudo-locale, a gallery binary that renders screenshots, runs in the pseudo-locale and measures frame time); panels and the shell arrive in their own modules"
registers = true
wasm = false
