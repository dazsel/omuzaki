[package]
name = "omuzaki-vts"
description = "The VTube Studio plugin API as data: message types, validators and limits (CN-13). No I/O; clean-room from the documented wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# An in-process mock VTube Studio server for tests (`testing`): off in every normal build.
testing = ["dep:tungstenite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tungstenite = { workspace = true, optional = true }

[dev-dependencies]
# The tests drive the mock with a raw WebSocket client and need the feature on.
omuzaki-vts = { path = ".", features = ["testing"] }
tungstenite.workspace = true

[lints]
workspace = true

# Native only: the later client task opens a WebSocket to a local app
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the VTube Studio plugin API as data (CN-13): the message `Envelope`, `ApiError` and `ErrorKind`, every request, response and event the bridge uses, and the validators and limits (`CustomParamName`, `ParamValue`, `FadeTime`); clean-room from the documented wire protocol, no I/O, native only"
wasm = false
