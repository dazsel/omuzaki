[package]
name = "omuzaki-vts"
description = "The VTube Studio bridge (CN-13): the plugin API as data, the client session, parameter injection and hotkeys, over loopback only; clean-room from the documented wire protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# An in-process mock VTube Studio server for tests (`testing`): off in every normal build.
testing = []

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# The client's WebSocket (and the mock's): sync, one bridge thread, no async runtime; ws:// to VTS on this computer.
tungstenite = "0.30"
omuzaki-anim-api = { path = "../omuzaki-anim-api" }
omuzaki-core = { path = "../omuzaki-core" }
omuzaki-secrets-api = { path = "../omuzaki-secrets-api" }

[dev-dependencies]
criterion.workspace = true
omuzaki-secrets-mock = { path = "../omuzaki-secrets-mock" }

[[bench]]
name = "push"
harness = false

# Against a running VTS, or with `--mock` the loopback mock: `cargo run -p omuzaki-vts --features testing --example
# vts_latency -- --mock`.
[[example]]
name = "vts_latency"
required-features = ["testing"]

[lints]
workspace = true

# Native only: the client opens a WebSocket to a local app
[package.metadata.omuzaki]
kind = "Implementation"
summary = "the VTube Studio bridge (CN-13): the plugin API as data (`Envelope`, `ApiError`, every request, response and event the bridge uses, `CustomParamName`, `ParamValue`, `FadeTime`), `VtsClient` (discovery, token authentication, reconnects on a backoff, the clean degrade on revoke, `BridgeStatus`, `TokenStore` with `SecretTokens`), `inject` (`ChannelMap` from `data/channel-map.toml`, the allocation-free `Injector`, one batched message per frame with a 500 ms keep-alive, conflicts to `add`) and `hotkeys` (`VtsMapping`, `suggest`, `HotkeyLimiter`); loopback only, clean-room from the documented wire protocol, native only"
wasm = false
